<!DOCTYPE html>
<!--
    PUZZLE ART PWA
    Version: 2.33
    
    CLEAN VERSION:
    - Només Picsum + Google Drive
    - Tauler adaptat a l'aspect ratio de la foto
-->
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/png" sizes="32x32" href="puzzle32x32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="puzzle192x192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="puzzle180x180.png">
    <!-- Google APIs -->
    <script src="https://apis.google.com/js/api.js"></script>
    <script src="https://accounts.google.com/gsi/client"></script>
    <title>Puzzle</title>
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f5f5f5;
            --bg-tertiary: #f0f0f0;
            --text-primary: #333333;
            --text-secondary: #666666;
            --border-color: #e0e0e0;
            --btn-bg: #667eea;
            --btn-hover: #5568d3;
            --gradient-1: #667eea;
            --gradient-2: #764ba2;
            --shadow: rgba(0, 0, 0, 0.2);
        }
        body.dark-mode {
            --bg-primary: #1e1e1e;
            --bg-secondary: #2d2d2d;
            --bg-tertiary: #3a3a3a;
            --text-primary: #e0e0e0;
            --text-secondary: #b0b0b0;
            --border-color: #444444;
            --btn-bg: #7c7cff;
            --btn-hover: #6b6bdd;
            --gradient-1: #5a5a8a;
            --gradient-2: #3a3a5a;
            --shadow: rgba(0, 0, 0, 0.5);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--gradient-1) 0%, var(--gradient-2) 100%);
            min-height: 100vh;
            min-height: 100dvh;
            padding: max(120px, env(safe-area-inset-top)) 10px 10px 10px;
            color: var(--text-primary);
            transition: background 0.3s;
            -webkit-user-select: none;
            user-select: none;
        }
        .container {
            max-width: 100%;
            margin: 50px auto 0 auto;
            background: var(--bg-primary);
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 10px 40px var(--shadow);
            transition: background 0.3s;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 8px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }
        h1 {
            color: var(--btn-bg);
            font-size: clamp(1.2rem, 5vw, 1.8rem);
            flex: 1;
        }
        h1 #version {
            font-size: 0.6em;
            opacity: 0.7;
            margin-left: 8px;
        }
        .controls-bar {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
            align-items: center;
            flex-wrap: nowrap;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }
        select {
            padding: clamp(6px, 2vw, 8px) clamp(6px, 2vw, 10px);
            border-radius: 6px;
            border: 2px solid var(--border-color);
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: clamp(11px, 2.5vw, 12px);
            flex-shrink: 0;
            touch-action: manipulation;
            height: clamp(36px, 10vw, 44px);
        }
        select:focus {
            outline: none;
            border-color: var(--btn-bg);
        }
        .icon-btn {
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            border-radius: 6px;
            width: clamp(36px, 10vw, 40px);
            height: clamp(36px, 10vw, 40px);
            cursor: pointer;
            font-size: clamp(16px, 4vw, 18px);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
            color: var(--text-primary);
            touch-action: manipulation;
        }
        .icon-btn:active {
            background: var(--btn-bg);
            color: white;
            border-color: var(--btn-bg);
            transform: scale(0.95);
        }
        .theme-toggle {
            background: var(--bg-secondary);
            border: none;
            border-radius: 50%;
            width: clamp(36px, 10vw, 44px);
            height: clamp(36px, 10vw, 44px);
            cursor: pointer;
            font-size: clamp(16px, 4vw, 18px);
            transition: background 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            touch-action: manipulation;
        }
        .theme-toggle:active {
            background: var(--bg-tertiary);
        }
        .puzzle-container-wrapper {
            max-width: 800px;
            margin: 0 auto 12px auto;
            display: flex;
            justify-content: center;
        }
        .puzzle-grid {
            display: grid;
            gap: 0;
            background: var(--bg-tertiary);
            padding: 2px;
            border-radius: 8px;
            touch-action: none;
            aspect-ratio: auto;
            width: 100%;
            max-width: 100%;
        }
        .puzzle-piece {
            background-size: cover;
            background-position: center;
            cursor: grab;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            position: relative;
        }
        .puzzle-piece.unfixed {
            margin: 2px;
            box-shadow: 0 2px 8px var(--shadow);
            border-radius: 2px;
        }
        .puzzle-piece.fixed {
            margin: 0;
            box-shadow: none;
            cursor: default;
            border-radius: 0;
        }
        .puzzle-piece:active:not(.fixed) {
            cursor: grabbing;
            opacity: 0.8;
            z-index: 100;
        }
        .image-preview {
            background: var(--bg-secondary);
            padding: clamp(10px, 2vw, 15px);
            border-radius: 8px;
            text-align: center;
            margin-bottom: 12px;
            min-height: clamp(100px, 30vw, 150px);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }
        .image-preview.hidden {
            display: none;
        }
        .image-preview img {
            max-width: 100%;
            max-height: 100%;
            border-radius: 6px;
        }
        .log {
            background: var(--bg-tertiary);
            padding: clamp(8px, 2vw, 10px);
            border-radius: 6px;
            font-size: clamp(11px, 2.5vw, 12px);
            color: var(--text-secondary);
            min-height: 1.5em;
            word-wrap: break-word;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }
        .victory-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }
        .victory-overlay.active {
            display: flex;
        }
        .victory-popup {
            background: var(--bg-primary);
            padding: clamp(20px, 5vw, 40px);
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            animation: popIn 0.4s ease-out;
            max-width: 95%;
            max-height: 95vh;
            overflow-y: auto;
        }
        .victory-popup h2 {
            font-size: clamp(1.8rem, 6vw, 2.5rem);
            color: var(--btn-bg);
            margin-bottom: 10px;
        }
        .victory-popup p {
            font-size: clamp(0.9rem, 3vw, 1.1rem);
            color: var(--text-primary);
            margin-bottom: 15px;
        }
        .victory-popup .final-puzzle {
            margin: 15px 0;
            border-radius: 12px;
            max-width: 100%;
            width: clamp(250px, 80vw, 450px);
            height: auto;
            max-height: 50vh;
            box-shadow: 0 4px 15px var(--shadow);
        }
        .victory-popup button {
            display: inline-block;
            width: auto;
            padding: clamp(10px, 2vw, 12px) clamp(25px, 5vw, 40px);
            background: var(--btn-bg);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: clamp(12px, 3vw, 1rem);
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 15px;
            touch-action: manipulation;
        }
        .victory-popup button:active {
            background: var(--btn-hover);
            transform: scale(0.98);
        }
        @keyframes popIn {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        @keyframes puzzleEntrance {
            0% { transform: scale(0) rotate(-180deg); opacity: 0; }
            50% { transform: scale(1.1) rotate(0deg); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        @keyframes puzzleFall {
            0% { transform: translateY(-80px) rotate(360deg); opacity: 0; }
            100% { transform: translateY(0) rotate(0deg); opacity: 1; }
        }
        @keyframes puzzleExplosion {
            0% { transform: scale(0.3) rotate(-180deg); opacity: 0; filter: blur(4px); }
            60% { transform: scale(1.2); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; filter: blur(0px); }
        }
        @keyframes puzzleFlip {
            0% { transform: rotateX(90deg) scale(0.5); opacity: 0; }
            100% { transform: rotateX(0deg) scale(1); opacity: 1; }
        }
        @keyframes puzzleSlideIn {
            0% { transform: translateX(-100px) rotate(-90deg); opacity: 0; }
            100% { transform: translateX(0) rotate(0deg); opacity: 1; }
        }
        @keyframes puzzleSlideInRight {
            0% { transform: translateX(100px) rotate(90deg); opacity: 0; }
            100% { transform: translateX(0) rotate(0deg); opacity: 1; }
        }
        @keyframes puzzleBounce {
            0% { transform: scale(0) translateY(-50px); opacity: 0; }
            50% { transform: scale(1.15); }
            70% { transform: scale(0.95); }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        @keyframes puzzleWave {
            0% { transform: translateY(40px) skewY(-5deg); opacity: 0; }
            100% { transform: translateY(0) skewY(0deg); opacity: 1; }
        }
        @keyframes puzzleZoomIn {
            0% { transform: scale(0) translateZ(0); opacity: 0; }
            70% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes puzzleGhost {
            0% { transform: translateY(-30px) rotate(180deg) scale(0.3); opacity: 0; filter: blur(8px) brightness(0.5); }
            50% { filter: blur(4px) brightness(0.8); }
            100% { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; filter: blur(0px) brightness(1); }
        }
        
        .puzzle-piece.entrance-spin { animation: puzzleEntrance 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards; }
        .puzzle-piece.entrance-fall { animation: puzzleFall 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        .puzzle-piece.entrance-explosion { animation: puzzleExplosion 0.8s cubic-bezier(0.36, 0, 0.66, -0.56) forwards; }
        .puzzle-piece.entrance-flip { animation: puzzleFlip 0.6s ease-out forwards; }
        .puzzle-piece.entrance-slide { animation: puzzleSlideIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards; }
        .puzzle-piece.entrance-slide-right { animation: puzzleSlideInRight 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards; }
        .puzzle-piece.entrance-bounce { animation: puzzleBounce 0.7s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards; }
        .puzzle-piece.entrance-wave { animation: puzzleWave 0.6s ease-out forwards; }
        .puzzle-piece.entrance-zoom { animation: puzzleZoomIn 0.6s cubic-bezier(0.43, 0.13, 0.23, 0.96) forwards; }
        .puzzle-piece.entrance-ghost { animation: puzzleGhost 0.8s ease-out forwards; }
        
        @media (max-width: 600px) {
            body { padding: 8px; }
            .container { padding: 10px; border-radius: 10px; }
            .controls-bar { gap: 4px; }
            .puzzle-grid { padding: 2px; }
            .puzzle-piece.unfixed { margin: 1px; }
        }
        @media (max-height: 700px) {
            .image-preview { min-height: 80px; }
        }
        /* FOOTER */
        footer.footer {
            margin-top: 50px;
            padding: 20px;
            text-align: center;
            border-top: 1px solid var(--border-color);
            background: var(--bg-secondary);
        }
        .footer-content {
            max-width: 600px;
            margin: 0 auto;
        }
        footer.footer p {
            color: var(--text-secondary);
            font-size: clamp(11px, 2.5vw, 12px);
            margin-bottom: 8px;
        }
        .footer-links {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .footer-links a {
            color: var(--btn-bg);
            font-size: clamp(11px, 2.5vw, 12px);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: all 0.2s;
        }
        .footer-links a:hover {
            border-bottom: 1px solid var(--btn-bg);
            opacity: 0.8;
        }
        .divider {
            color: var(--text-secondary);
        }
        @media (max-width: 600px) {
            footer.footer { padding: 15px; }
            .footer-links { gap: 6px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧩 Puzzle <span id="version">v2.33</span></h1>
            <button class="icon-btn" id="animationsToggle" title="Activar/desactivar animacions">✨</button>
            <button class="icon-btn" id="helpToggle" title="Amb ajuda o sense">🚀</button>
            <button class="theme-toggle" id="themeToggle" title="Canviar mode fosc">🌙</button>
        </div>
        <div class="controls-bar">
            <select id="divisionsSelect" title="Nombre de peces">
                <option value="2">2×2</option>
                <option value="3">3×3</option>
                <option value="4" selected>4×4</option>
                <option value="5">5×5</option>
            </select>
            <button class="icon-btn" id="picsumBtn" title="Imatge aleatoria">🎨</button>
            <button class="icon-btn" id="driveBtn" title="Google Drive">📁</button>
            <button class="icon-btn" id="refreshBtn" title="Nova foto">🔄</button>
            <div style="flex: 1;"></div>
        </div>
        <div class="puzzle-container-wrapper">
            <div id="puzzleContainer" class="puzzle-grid"></div>
        </div>
        <div id="imagePreview" class="image-preview">
            <img id="previewImg" src="" alt="Original" crossOrigin="anonymous">
        </div>
        <div class="log" id="log">Carregant...</div>
    </div>
    <div id="victoryOverlay" class="victory-overlay">
        <div class="victory-popup">
            <h2>🎉VISCA🎉</h2>
            <p>Has completat el puzzle!</p>
            <img id="finalImage" class="final-puzzle" src="" alt="Puzzle completat">
            <br>
            <button id="victoryBtn">Jugar de Nou</button>
        </div>
    </div>
    <script>
        const divisionsSelect = document.getElementById('divisionsSelect');
        const picsumBtn = document.getElementById('picsumBtn');
        const driveBtn = document.getElementById('driveBtn');
        const refreshBtn = document.getElementById('refreshBtn');
        const animationsToggle = document.getElementById('animationsToggle');
        const helpToggle = document.getElementById('helpToggle');
        const puzzleContainer = document.getElementById('puzzleContainer');
        const previewImg = document.getElementById('previewImg');
        const logDiv = document.getElementById('log');
        const victoryOverlay = document.getElementById('victoryOverlay');
        const victoryBtn = document.getElementById('victoryBtn');
        const finalImage = document.getElementById('finalImage');
        const themeToggle = document.getElementById('themeToggle');
        const imagePreview = document.getElementById('imagePreview');

        let imagenActual = null;
        let divisions = 4;
        let ordre = [];
        let fixat = [];
        let pecesDataURL = [];
        let lastSource = 'picsum';
        let isDifficultyMode = true;
        let isAnimationsEnabled = true;
        let photoWidth = 400;
        let photoHeight = 400;
        
        const animationTypes = [
            'entrance-spin', 'entrance-fall', 'entrance-explosion', 'entrance-flip',
            'entrance-slide', 'entrance-slide-right', 'entrance-bounce', 'entrance-wave',
            'entrance-zoom', 'entrance-ghost'
        ];

        function initTheme() {
            const isDark = localStorage.getItem('darkMode') === 'true';
            if (isDark) {
                document.body.classList.add('dark-mode');
                themeToggle.textContent = '☀️';
            }
        }

        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('darkMode', isDark);
            themeToggle.textContent = isDark ? '☀️' : '🌙';
        });

        helpToggle.addEventListener('click', () => {
            isDifficultyMode = !isDifficultyMode;
            if (isDifficultyMode) {
                helpToggle.textContent = '🆘';
                imagePreview.classList.add('hidden');
            } else {
                helpToggle.textContent = '🚀';
                imagePreview.classList.remove('hidden');
            }
        });

        function initAnimations() {
            const saved = localStorage.getItem('enableAnimations');
            isAnimationsEnabled = saved !== 'false';
            updateAnimationsButton();
        }

        function updateAnimationsButton() {
            animationsToggle.style.opacity = isAnimationsEnabled ? '1' : '0.4';
        }

        animationsToggle.addEventListener('click', () => {
            isAnimationsEnabled = !isAnimationsEnabled;
            localStorage.setItem('enableAnimations', isAnimationsEnabled);
            updateAnimationsButton();
            log(isAnimationsEnabled ? '✨ Animacions activades' : '✨ Animacions desactivades');
        });

        function getRandomAnimation() {
            return animationTypes[Math.floor(Math.random() * animationTypes.length)];
        }

        function cargarImagenDesdeUrl(imageUrl, source) {
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = () => {
                imagenActual = imageUrl;
                photoWidth = img.naturalWidth;
                photoHeight = img.naturalHeight;
                previewImg.onload = () => {
                    log('✅ Foto carregada');
                    iniciarPuzzle();
                };
                previewImg.src = imageUrl;
                finalImage.src = imageUrl;
            };
            img.onerror = () => {
                log('❌ Error al carregar la foto');
            };
            img.src = imageUrl;
        }

        picsumBtn.addEventListener('click', () => {
            puzzleContainer.innerHTML = '';
            lastSource = 'picsum';
            carregarImagenAleatoria();
        });

        function log(msg) {
            console.log(msg);
            logDiv.textContent = msg;
        }

        function carregarImagenAleatoria() {
            log('🔄 Carregant imatge...');
            const seed = Math.floor(Math.random() * 1000000);
            const imageUrl = `https://picsum.photos/seed/puzzle${seed}/800/600`;
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = () => {
                imagenActual = imageUrl;
                photoWidth = img.naturalWidth;
                photoHeight = img.naturalHeight;
                previewImg.onload = () => {
                    log('✅ Imatge carregada');
                    iniciarPuzzle();
                };
                previewImg.src = imageUrl;
                finalImage.src = imageUrl;
            };
            img.onerror = () => {
                log('❌ Error al carregar. Proba de nou.');
            };
            img.src = imageUrl;
        }

        /* GOOGLE DRIVE */
        let tokenClient;
        const GOOGLE_CLIENT_ID = '926201791608-862s6b2rebjqjrpv59kt71u5v203ltb4.apps.googleusercontent.com';
        const GOOGLE_FOLDER_ID = '1us5-pJI8WVB1B4XNS82uyHjsXKETsG0m';

        function initGoogleApi() {
            gapi.load('client', () => {
                gapi.client.init({
                    discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest']
                }).then(() => {
                    console.log('✅ Google API client inicialitzat');
                }).catch(err => {
                    console.log('❌ Error inicialitzant Google API:', err);
                });
            });

            if (window.google && google.accounts) {
                tokenClient = google.accounts.oauth2.initTokenClient({
                    client_id: GOOGLE_CLIENT_ID,
                    scope: 'https://www.googleapis.com/auth/drive.readonly',
                    callback: (tokenResponse) => {
                        if (tokenResponse && tokenResponse.access_token) {
                            log('✅ Autenticació completada');
                            obtenirFotosDrive();
                        }
                    }
                });
            }
        }

        driveBtn.addEventListener('click', () => {
            lastSource = 'drive';
            carregarGoogleDrive();
        });

        async function carregarGoogleDrive() {
            log('📁 Connectant a Google Drive...');
            if (gapi.client.getToken() === null) {
                log('🔐 Sol·licitant accés a Google...');
                tokenClient.requestAccessToken({prompt: 'consent'});
            } else {
                obtenirFotosDrive();
            }
        }

        async function obtenirFotosDrive() {
            try {
                log('🔄 Obtenint fotos de Google Drive...');
                const response = await gapi.client.drive.files.list({
                    q: `'${GOOGLE_FOLDER_ID}' in parents and (mimeType='image/jpeg' or mimeType='image/png' or mimeType='image/gif' or mimeType='image/webp') and trashed=false`,
                    spaces: 'drive',
                    fields: 'files(id, name, mimeType)',
                    pageSize: 1000
                });
                const files = response.result.files;
                if (!files || files.length === 0) {
                    log('❌ Cap foto a Google Drive');
                    return;
                }
                log(`✅ Trobades ${files.length} fotos`);
                const fileAleatori = files[Math.floor(Math.random() * files.length)];
                log(`📸 Descarregant: ${fileAleatori.name}`);
                puzzleContainer.innerHTML = '';
                cargarImagenDesdeDrive(fileAleatori.id, fileAleatori.name);
            } catch (err) {
                log('❌ Error a Google Drive: ' + (err.message || 'Desconegut'));
            }
        }

        async function cargarImagenDesdeDrive(fileId, fileName) {
            try {
                const tokenInfo = gapi.client.getToken();
                if (!tokenInfo || !tokenInfo.access_token) {
                    log('❌ Error: No s\'ha trobat el token d\'autenticació.');
                    return;
                }
                const response = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
                    headers: { 'Authorization': `Bearer ${tokenInfo.access_token}` }
                });
                if (!response.ok) throw new Error(`Codi d'error: ${response.status}`);
                const imageBlob = await response.blob();
                const localUrl = URL.createObjectURL(imageBlob);
                const img = new Image();
                img.onload = () => {
                    imagenActual = localUrl;
                    photoWidth = img.naturalWidth;
                    photoHeight = img.naturalHeight;
                    previewImg.onload = () => {
                        log(`✅ Imatge carregada: ${fileName}`);
                        iniciarPuzzle();
                    };
                    previewImg.src = localUrl;
                    finalImage.src = localUrl;
                };
                img.onerror = () => {
                    log('❌ Error en processar el Blob de la imatge');
                };
                img.src = localUrl;
            } catch (err) {
                log(`❌ Error al descarregar l'arxiu: ${err.message}`);
            }
        }

        function carregarUltima() {
            if (lastSource === 'picsum') {
                carregarImagenAleatoria();
            } else if (lastSource === 'drive') {
                carregarGoogleDrive();
            }
        }

        refreshBtn.addEventListener('click', () => {
            puzzleContainer.innerHTML = '';
            carregarUltima();
        });

        function iniciarPuzzle() {
            if (!imagenActual) {
                log('⚠️ Carrega una imatge primer');
                return;
            }

            divisions = parseInt(divisionsSelect.value);
            const total = divisions * divisions;
            log(`📦 Creant puzzle ${divisions}×${divisions}...`);

            // Calcular mida del canvas mantenint l'aspect ratio
            const maxCanvasWidth = 800;
            const maxCanvasHeight = 800;
            let canvasWidth = photoWidth;
            let canvasHeight = photoHeight;

            if (canvasWidth > maxCanvasWidth || canvasHeight > maxCanvasHeight) {
                const scaleW = maxCanvasWidth / canvasWidth;
                const scaleH = maxCanvasHeight / canvasHeight;
                const scale = Math.min(scaleW, scaleH);
                canvasWidth = canvasWidth * scale;
                canvasHeight = canvasHeight * scale;
            }

            const canvas = document.createElement('canvas');
            canvas.width = canvasWidth;
            canvas.height = canvasHeight;
            const ctx = canvas.getContext('2d');

            const processImage = () => {
                try {
                    ctx.drawImage(previewImg, 0, 0, canvasWidth, canvasHeight);
                } catch (e) {
                    log('❌ Error al dibuixar la imatge');
                    return;
                }

                pecesDataURL = [];
                const pieceWidth = canvasWidth / divisions;
                const pieceHeight = canvasHeight / divisions;

                for (let row = 0; row < divisions; row++) {
                    for (let col = 0; col < divisions; col++) {
                        const pieceCanvas = document.createElement('canvas');
                        pieceCanvas.width = pieceWidth;
                        pieceCanvas.height = pieceHeight;
                        const pctx = pieceCanvas.getContext('2d');
                        pctx.drawImage(
                            canvas,
                            col * pieceWidth, row * pieceHeight, pieceWidth, pieceHeight,
                            0, 0, pieceWidth, pieceHeight
                        );
                        pecesDataURL.push(pieceCanvas.toDataURL());
                    }
                }

                ordre = Array.from({ length: total }, (_, i) => i);
                for (let i = total - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [ordre[i], ordre[j]] = [ordre[j], ordre[i]];
                }
                fixat = new Array(total).fill(false);

                puzzleContainer.innerHTML = '';
                puzzleContainer.style.gridTemplateColumns = '1fr';
                puzzleContainer.style.aspectRatio = `${canvasWidth} / ${canvasHeight}`;

                const imatgeSenceraDiv = document.createElement('div');
                imatgeSenceraDiv.style.width = '100%';
                imatgeSenceraDiv.style.height = '100%';
                imatgeSenceraDiv.style.backgroundImage = `url('${imagenActual}')`;
                imatgeSenceraDiv.style.backgroundSize = '100% 100%';
                imatgeSenceraDiv.style.backgroundPosition = 'center';
                imatgeSenceraDiv.style.borderRadius = '6px';

                puzzleContainer.appendChild(imatgeSenceraDiv);

                if (!isDifficultyMode) {
                    imagePreview.classList.remove('hidden');
                    log('✨ Veient la foto sencera (ajuda visible)...');
                } else {
                    log('✨ Veient la foto sencera (sense ajuda)...');
                }

                setTimeout(() => {
                    renderitzarPuzzle(true, canvasWidth, canvasHeight, pieceWidth, pieceHeight);
                    log('🧩 Arrossega les peces!');
                }, 2500);
            };

            processImage();
        }

        function renderitzarPuzzle(animate = false, canvasWidth = 400, canvasHeight = 400, pieceWidth = 100, pieceHeight = 100) {
            const total = divisions * divisions;
            puzzleContainer.innerHTML = '';
            puzzleContainer.style.gridTemplateColumns = `repeat(${divisions}, 1fr)`;
            puzzleContainer.style.aspectRatio = `${canvasWidth} / ${canvasHeight}`;

            for (let i = 0; i < total; i++) {
                const pecaIndex = ordre[i];
                const piece = document.createElement('div');
                piece.className = 'puzzle-piece';
                piece.classList.add(fixat[i] ? 'fixed' : 'unfixed');
                piece.style.backgroundImage = `url('${pecesDataURL[pecaIndex]}')`;
                piece.style.backgroundSize = '100% 100%';
                piece.style.backgroundPosition = 'center';
                piece.dataset.posicio = i;

                if (animate && isAnimationsEnabled) {
                    const randomAnimation = getRandomAnimation();
                    piece.classList.add(randomAnimation);
                    piece.style.animationDelay = (i * 0.05) + 's';
                }

                if (!fixat[i]) {
                    piece.draggable = true;
                    piece.addEventListener('dragstart', handleDragStart);
                    piece.addEventListener('dragover', handleDragOver);
                    piece.addEventListener('drop', handleDrop);
                    piece.addEventListener('dragend', handleDragEnd);
                    piece.addEventListener('touchstart', handleTouchStart);
                    piece.addEventListener('touchmove', handleTouchMove);
                    piece.addEventListener('touchend', handleTouchEnd);
                }
                puzzleContainer.appendChild(piece);
            }
        }

        let origenIndex = null;

        function handleDragStart(e) {
            origenIndex = parseInt(e.target.dataset.posicio);
            e.dataTransfer.effectAllowed = 'move';
            e.target.style.opacity = '0.5';
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        }

        function handleDrop(e) {
            e.preventDefault();
            const destiPiece = e.target.closest('.puzzle-piece');
            if (!destiPiece || fixat[destiPiece.dataset.posicio]) return;
            const destiIndex = parseInt(destiPiece.dataset.posicio);
            if (origenIndex === null || origenIndex === destiIndex) return;
            [ordre[origenIndex], ordre[destiIndex]] = [ordre[destiIndex], ordre[origenIndex]];
            for (let i = 0; i < ordre.length; i++) {
                fixat[i] = (ordre[i] === i);
            }
            renderitzarPuzzle(false);
            comprovarVictoria();
            origenIndex = null;
        }

        function handleDragEnd(e) {
            e.target.style.opacity = '1';
        }

        let touchPiece = null;
        let floatingClone = null;

        function handleTouchStart(e) {
            touchPiece = e.target.closest('.puzzle-piece');
            if (!touchPiece || fixat[touchPiece.dataset.posicio]) return;
            floatingClone = touchPiece.cloneNode(true);
            floatingClone.style.position = 'fixed';
            floatingClone.style.zIndex = '1001';
            floatingClone.style.pointerEvents = 'none';
            floatingClone.style.boxShadow = '0 8px 20px rgba(0,0,0,0.3)';
            floatingClone.classList.add('unfixed');
            const rect = touchPiece.getBoundingClientRect();
            floatingClone.style.left = rect.left + 'px';
            floatingClone.style.top = rect.top + 'px';
            floatingClone.style.width = rect.width + 'px';
            floatingClone.style.height = rect.height + 'px';
            document.body.appendChild(floatingClone);
            touchPiece.style.opacity = '0.3';
        }

        function handleTouchMove(e) {
            if (!floatingClone) return;
            e.preventDefault();
            const touch = e.touches[0];
            const rect = floatingClone.getBoundingClientRect();
            const width = rect.width;
            const height = rect.height;
            floatingClone.style.left = (touch.clientX - width / 2) + 'px';
            floatingClone.style.top = (touch.clientY - height / 2) + 'px';
        }

        function handleTouchEnd(e) {
            if (!touchPiece || !floatingClone) return;
            const touch = e.changedTouches[0];
            const targetElement = document.elementFromPoint(touch.clientX, touch.clientY);
            const destiPiece = targetElement.closest('.puzzle-piece');
            if (destiPiece && destiPiece !== touchPiece && !fixat[destiPiece.dataset.posicio]) {
                const origenIndex = parseInt(touchPiece.dataset.posicio);
                const destiIndex = parseInt(destiPiece.dataset.posicio);
                [ordre[origenIndex], ordre[destiIndex]] = [ordre[destiIndex], ordre[origenIndex]];
                for (let i = 0; i < ordre.length; i++) {
                    fixat[i] = (ordre[i] === i);
                }
                renderitzarPuzzle(false);
                comprovarVictoria();
            } else {
                touchPiece.style.opacity = '1';
            }
            document.body.removeChild(floatingClone);
            floatingClone = null;
            touchPiece = null;
        }

        function comprovarVictoria() {
            const totsFixats = fixat.every(v => v === true);
            if (totsFixats) {
                log('🎉 VISCA!');
                victoryOverlay.classList.add('active');
            } else {
                const correctes = fixat.filter(v => v).length;
                log(`🧩 ${correctes}/${ordre.length} peces correctes`);
            }
        }

        victoryBtn.addEventListener('click', () => {
            victoryOverlay.classList.remove('active');
            puzzleContainer.innerHTML = '';
            carregarUltima();
        });

        divisionsSelect.addEventListener('change', () => {
            if (imagenActual) iniciarPuzzle();
        });

        initTheme();
        initAnimations();

        if (isDifficultyMode) {
            helpToggle.textContent = '🆘';
            imagePreview.classList.add('hidden');
        } else {
            helpToggle.textContent = '🚀';
            imagePreview.classList.remove('hidden');
        }

        initGoogleApi();
        carregarImagenAleatoria();
    </script>
