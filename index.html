<!DOCTYPE html>
<!--
    TRENCACLOSQUES — PWA
    Version: 3.04  ·  Disseny "Barra de Joc" (Proposta C)

    CORRECCIONS v3.04
    - Error crític: el botó githubBtn està comentat a l'HTML i l'addEventListener
      sobre null aturava tot el script (no carregaven fotos, (i) inactiu,
      no s'aplicaven les classes ios-app / landscape-mode)
    - Marges superiors basats en safe-area també per CSS (no depenen del JS)
    - Navegador web en vertical: marge superior 20px
    - Títol amagat en horitzontal en pantalles baixes també per CSS
    - Botó 4×4: text centrat amb etiqueta visible + select natiu transparent
    - Font de les fotos: "© Gerard M." (abans mostrava "&copy;" literal)

    NOVETATS DE DISSENY
    - Material Symbols Rounded en lloc d'emojis
    - Mode dia: colors vius i sòlids, botons amb base de relleu
    - Mode nit: vidre translúcid amb llum de color
    - Barra única rodona amb desplaçament lateral
    - Tauler emmarcat i xips d'estadístiques

    FUNCIONALITAT (intacta respecte v2.42)
    - Fotos GG prioritari + Picsum de reserva
    - Filtrat per orientació (thumbnail / hthumbnail)
    - Sense repeticions fins exhaurir el llistat
    - Bloqueig d'orientació persistent
    - Padding segons context (app / navegador)
    - Partides comptades només en resoldre
-->
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#ff9f45">
<link rel="icon" type="image/png" sizes="32x32" href="puzzle32x32.png">
<link rel="icon" type="image/png" sizes="192x192" href="puzzle192x192.png">
<link rel="apple-touch-icon" sizes="180x180" href="puzzle180x180.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&family=Fredoka:wght@400;500;600;700&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">

<title>Trencaclosques</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}

.material-symbols-rounded{
  font-family:'Material Symbols Rounded';
  font-variation-settings:'FILL' 1,'wght' 600,'GRAD' 0,'opsz' 40;
  line-height:1;font-size:24px;
  font-weight:normal;font-style:normal;letter-spacing:normal;
  text-transform:none;display:inline-block;white-space:nowrap;
  word-wrap:normal;direction:ltr;
}

/* ═══════════════════════════════════════════════════════
   MODE NIT
   ═══════════════════════════════════════════════════════ */
body{
  --stage:linear-gradient(170deg,#241a3d 0%,#120e21 100%);
  --page:#14101c;
  --bar-bg:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.04));
  --bar-border:rgba(255,255,255,.16);
  --bar-shadow:inset 0 1px 0 rgba(255,255,255,.3), 0 8px 22px rgba(0,0,0,.45);
  --pill-bg:linear-gradient(160deg,rgba(255,255,255,.2),rgba(255,255,255,.06));
  --pill-shadow:inset 0 1px 0 rgba(255,255,255,.45), 0 4px 10px rgba(0,0,0,.4);
  --ink:#fff;
  --ink-soft:rgba(255,255,255,.6);
  --accent:#ffd166;
  --accent-deep:#f0a020;
  --accent-ink:#3a1f00;
  --board-border:rgba(255,209,102,.6);
  --board-halo:rgba(255,209,102,.12);
  --board-bg:rgba(255,255,255,.06);
  --chip-bg:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,.05));
  --chip-border:rgba(255,255,255,.18);
  --chip-shadow:inset 0 1px 0 rgba(255,255,255,.35);
  --panel-bg:linear-gradient(170deg,#2c2050,#161029);
  --piece-ring:rgba(255,209,102,.45);

  font-family:'Fredoka',system-ui,-apple-system,sans-serif;
  background:var(--page);
  color:var(--ink);
  height:100vh;height:100dvh;
  overflow:hidden;
  -webkit-user-select:none;user-select:none;
  transition:background .35s;
}

/* ═══════════════════════════════════════════════════════
   MODE DIA — colors vius i sòlids
   ═══════════════════════════════════════════════════════ */
body.day{
  --stage:linear-gradient(165deg,#ffd86b 0%,#ff9f45 38%,#ff6b9d 100%);
  --page:#fff4dc;
  --bar-bg:#ffffff;
  --bar-border:#ffffff;
  --bar-shadow:inset 0 -4px 0 rgba(0,0,0,.07), 0 10px 26px rgba(214,96,30,.3);
  --pill-bg:#ffffff;
  --pill-shadow:none;
  --ink:#3c2a14;
  --ink-soft:rgba(60,42,20,.65);
  --accent:#ffc83d;
  --accent-deep:#ff8a00;
  --accent-ink:#4a2600;
  --board-border:#ffffff;
  --board-halo:rgba(255,255,255,.45);
  --board-bg:rgba(255,255,255,.35);
  --chip-bg:#ffffff;
  --chip-border:transparent;
  --chip-shadow:0 3px 0 rgba(0,0,0,.1), 0 6px 12px rgba(150,60,10,.18);
  --panel-bg:linear-gradient(170deg,#fff8ec,#ffe6c2);
  --piece-ring:rgba(255,255,255,.8);
}

/* ── contenidor ─────────────────────────────────────── */
.container{
  max-width:1100px;margin:0 auto;height:100%;
  display:flex;flex-direction:column;min-height:0;
}

.stage{
  background:var(--stage);
  border-radius:28px;
  padding:16px 14px 18px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14), 0 22px 50px rgba(0,0,0,.4);
  transition:background .35s;
  flex:1;min-height:0;
  display:flex;flex-direction:column;
}

/* zona de joc: menú + tauler */
.play{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px}
.main{flex:1;min-height:0;min-width:0;display:flex;flex-direction:column}

/* ── títol ──────────────────────────────────────────── */
.brand{
  font-family:'Baloo 2',sans-serif;font-weight:800;text-align:center;
  font-size:clamp(26px,7.5vw,46px);letter-spacing:-1px;margin-bottom:14px;
  color:#fff;line-height:1.05;
  text-shadow:0 0 10px rgba(167,139,250,.45), 0 2px 6px rgba(0,0,0,.3);
}
body.day .brand{
  background:linear-gradient(180deg,#fff 0%,#fff1b8 45%,#ffb020 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:none;
  filter:drop-shadow(0 1px 0 rgba(190,80,20,.55)) drop-shadow(0 3px 5px rgba(120,40,0,.25));
}
.brand .v{
  display:block;font-family:'Fredoka';font-weight:500;
  font-size:11px;letter-spacing:3px;text-transform:uppercase;
  color:#a5b4fc;opacity:.8;margin-top:2px;-webkit-text-fill-color:#a5b4fc;
  filter:none;text-shadow:none;
}
body.day .brand .v{color:#fff;-webkit-text-fill-color:#fff;opacity:.85;
  text-shadow:0 1px 2px rgba(150,60,10,.35)}

/* ── barra de control ───────────────────────────────── */
.bar{
  display:flex;align-items:center;gap:8px;flex-wrap:nowrap;
  background:var(--bar-bg);border:1px solid var(--bar-border);
  border-radius:99px;padding:8px 10px;box-shadow:var(--bar-shadow);
  overflow-x:auto;scrollbar-width:none;
  transition:background .35s,box-shadow .35s;
}
.bar::-webkit-scrollbar{display:none}

.pill{
  flex:0 0 auto;width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;
  display:grid;place-items:center;color:var(--ink);position:relative;
  background:var(--pill-bg);box-shadow:var(--pill-shadow);
  transition:transform .13s cubic-bezier(.34,1.56,.64,1),background .35s,box-shadow .35s,opacity .2s;
}
.pill:active{transform:scale(.9)}
.pill .material-symbols-rounded{font-size:24px;filter:drop-shadow(0 0 8px var(--glow))}

/* dia: el botó sencer pren el color, amb base sòlida */
body.day .pill{
  background:var(--tint);color:#fff;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.55), 0 4px 0 var(--tint-deep), 0 7px 12px rgba(0,0,0,.22);
}
body.day .pill .material-symbols-rounded{filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
body.day .pill:active{
  transform:translateY(3px);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.5), 0 1px 0 var(--tint-deep), 0 2px 5px rgba(0,0,0,.25);
}

/* estat encès */
.pill.on{
  background:linear-gradient(160deg,var(--accent),var(--accent-deep));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 0 18px rgba(240,160,32,.65),0 4px 10px rgba(0,0,0,.45);
  color:var(--accent-ink);
}
.pill.on .material-symbols-rounded{filter:none}
body.day .pill.on{
  background:linear-gradient(160deg,#ffe066,#ff9f1a);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.8), 0 4px 0 #d97706, 0 7px 12px rgba(0,0,0,.25);
  color:var(--accent-ink);
}

/* estat apagat (animacions off) */
.pill.off{opacity:.4}

.spacer{flex:1 1 auto;min-width:6px}

.select{
  flex:0 0 auto;position:relative;
  display:grid;place-items:center;
  height:44px;min-width:64px;border-radius:99px;padding:0 14px;cursor:pointer;
  font-family:'Fredoka';font-weight:600;font-size:14px;color:var(--ink);
  border:none;background:var(--pill-bg);box-shadow:var(--pill-shadow);
  transition:background .35s,box-shadow .35s;
}
/* Text visible: sempre centrat, sigui quin sigui el navegador */
.select-label{font-size:inherit;line-height:1;pointer-events:none;white-space:nowrap}
/* Select natiu invisible que ocupa tot el botó: en tocar obre el selector del sistema */
.select select{
  position:absolute;inset:0;width:100%;height:100%;
  opacity:0;cursor:pointer;border:0;border-radius:inherit;
  appearance:none;-webkit-appearance:none;
  font-size:16px; /* evita el zoom automàtic d'iOS */
}
.select select option{color:#3c2a14;background:#fff}
.select:focus-within{outline:2px solid var(--accent);outline-offset:2px}
body.day .select{
  background:linear-gradient(160deg,#8b5cf6,#6d28d9);color:#fff;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.45), 0 4px 0 #4c1d95, 0 7px 12px rgba(0,0,0,.22);
}

/* ── tauler ─────────────────────────────────────────── */
.board-wrap{
  flex:1;min-height:0;min-width:0;
  display:flex;align-items:center;justify-content:center;
  padding:4px 0;
}

.puzzle-grid{
  display:grid;gap:0;
  margin:0 auto;
  background:var(--board-bg);
  padding:5px;border-radius:20px;touch-action:none;aspect-ratio:auto;
  border:3px solid var(--board-border);
  box-shadow:0 0 0 6px var(--board-halo), inset 0 0 40px rgba(0,0,0,.3), 0 16px 36px rgba(0,0,0,.35);
  transition:border-color .35s,background .35s;
}

.puzzle-piece{
  background-size:100% 100%;background-position:center;
  cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;position:relative;
}
.puzzle-piece.unfixed{
  margin:3px;border-radius:6px;
  box-shadow:0 0 0 2px var(--piece-ring), 0 5px 12px rgba(0,0,0,.45);
  transition:box-shadow .18s,transform .18s;
}
.puzzle-piece.unfixed:active{cursor:grabbing;transform:scale(1.06);z-index:100}
.puzzle-piece.fixed{
  margin:0;border-radius:0;cursor:default;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);
}

/* ── ajuda visual ───────────────────────────────────── */
.image-preview{
  flex:0 0 auto;
  margin-top:10px;padding:8px;border-radius:18px;
  background:var(--chip-bg);border:1px solid var(--chip-border);
  box-shadow:var(--chip-shadow);
  display:flex;align-items:center;justify-content:center;
  min-height:90px;transition:background .35s;
}
.image-preview.hidden{display:none}
.image-preview img{max-width:100%;max-height:26vh;border-radius:12px;display:block}

/* ── consola de missatges ───────────────────────────── */
.log{
  flex:0 0 auto;
  margin-top:10px;padding:9px 16px;border-radius:99px;
  background:var(--chip-bg);border:1px solid var(--chip-border);
  box-shadow:var(--chip-shadow);
  font-size:13px;font-weight:500;color:var(--ink);
  min-height:2.6em;display:flex;align-items:center;justify-content:center;
  text-align:center;word-wrap:break-word;transition:background .35s,color .35s;
}

/* ── xips d'estadístiques ───────────────────────────── */
.stats{flex:0 0 auto;display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;justify-content:center}
.stats.hidden{display:none}
.chip{
  display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:99px;
  background:var(--chip-bg);border:1px solid var(--chip-border);
  box-shadow:var(--chip-shadow);
  font-size:13px;font-weight:600;color:var(--ink);
  transition:background .35s,color .35s;
}
.chip .material-symbols-rounded{font-size:19px}
.chip b{font-family:'Baloo 2';font-size:15px;font-weight:700}

/* ── victòria ───────────────────────────────────────── */
.victory-overlay{
  position:fixed;inset:0;background:rgba(10,6,20,.72);
  display:none;align-items:center;justify-content:center;z-index:1000;
  backdrop-filter:blur(6px);padding:20px;
}
.victory-overlay.active{display:flex}
.victory-popup{
  background:var(--panel-bg);
  padding:26px 22px;border-radius:28px;text-align:center;
  box-shadow:0 24px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.25);
  animation:popIn .45s cubic-bezier(.34,1.56,.64,1);
  max-width:96%;max-height:92vh;overflow-y:auto;
  border:2px solid var(--board-border);
}
.victory-popup .trophy{
  font-size:56px;color:var(--accent);
  filter:drop-shadow(0 4px 0 var(--accent-deep)) drop-shadow(0 8px 14px rgba(0,0,0,.45));
  font-variation-settings:'FILL' 1,'wght' 700,'opsz' 48;
}
.victory-popup h2{
  font-family:'Baloo 2',sans-serif;font-weight:800;
  font-size:clamp(28px,7vw,40px);margin:6px 0 4px;color:var(--ink);
  letter-spacing:-.5px;
}
.victory-popup p{font-size:14px;color:var(--ink-soft);margin-bottom:14px}
.victory-popup .final-puzzle{
  margin:0 auto 16px;border-radius:16px;display:block;
  max-width:100%;width:clamp(220px,70vw,400px);height:auto;max-height:42vh;
  box-shadow:0 0 0 4px var(--board-border), 0 10px 26px rgba(0,0,0,.5);
}
.btn-big{
  display:inline-flex;align-items:center;gap:8px;
  padding:14px 30px;border:none;border-radius:99px;cursor:pointer;
  font-family:'Fredoka';font-weight:600;font-size:16px;color:var(--accent-ink);
  background:linear-gradient(160deg,var(--accent),var(--accent-deep));
  box-shadow:inset 0 2px 0 rgba(255,255,255,.7), 0 5px 0 rgba(0,0,0,.3), 0 10px 20px rgba(0,0,0,.4);
  transition:transform .13s cubic-bezier(.34,1.56,.64,1),box-shadow .13s;
}
.btn-big:active{transform:translateY(4px);box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 1px 0 rgba(0,0,0,.3),0 3px 8px rgba(0,0,0,.4)}

@keyframes popIn{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}

/* ── animacions d'entrada de les peces ──────────────── */
@keyframes puzzleEntrance{0%{transform:scale(0) rotate(-180deg);opacity:0}50%{transform:scale(1.1) rotate(0)}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes puzzleFall{0%{transform:translateY(-80px) rotate(360deg);opacity:0}100%{transform:translateY(0) rotate(0);opacity:1}}
@keyframes puzzleExplosion{0%{transform:scale(.3) rotate(-180deg);opacity:0;filter:blur(4px)}60%{transform:scale(1.2)}100%{transform:scale(1) rotate(0);opacity:1;filter:blur(0)}}
@keyframes puzzleFlip{0%{transform:rotateX(90deg) scale(.5);opacity:0}100%{transform:rotateX(0) scale(1);opacity:1}}
@keyframes puzzleSlideIn{0%{transform:translateX(-100px) rotate(-90deg);opacity:0}100%{transform:translateX(0) rotate(0);opacity:1}}
@keyframes puzzleSlideInRight{0%{transform:translateX(100px) rotate(90deg);opacity:0}100%{transform:translateX(0) rotate(0);opacity:1}}
@keyframes puzzleBounce{0%{transform:scale(0) translateY(-50px);opacity:0}50%{transform:scale(1.15)}70%{transform:scale(.95)}100%{transform:scale(1) translateY(0);opacity:1}}
@keyframes puzzleWave{0%{transform:translateY(40px) skewY(-5deg);opacity:0}100%{transform:translateY(0) skewY(0);opacity:1}}
@keyframes puzzleZoomIn{0%{transform:scale(0);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
@keyframes puzzleGhost{0%{transform:translateY(-30px) rotate(180deg) scale(.3);opacity:0;filter:blur(8px) brightness(.5)}50%{filter:blur(4px) brightness(.8)}100%{transform:translateY(0) rotate(0) scale(1);opacity:1;filter:blur(0) brightness(1)}}

.puzzle-piece.entrance-spin{animation:puzzleEntrance .6s cubic-bezier(.68,-.55,.265,1.55) forwards}
.puzzle-piece.entrance-fall{animation:puzzleFall .7s cubic-bezier(.34,1.56,.64,1) forwards}
.puzzle-piece.entrance-explosion{animation:puzzleExplosion .8s cubic-bezier(.36,0,.66,-.56) forwards}
.puzzle-piece.entrance-flip{animation:puzzleFlip .6s ease-out forwards}
.puzzle-piece.entrance-slide{animation:puzzleSlideIn .5s cubic-bezier(.68,-.55,.265,1.55) forwards}
.puzzle-piece.entrance-slide-right{animation:puzzleSlideInRight .5s cubic-bezier(.68,-.55,.265,1.55) forwards}
.puzzle-piece.entrance-bounce{animation:puzzleBounce .7s cubic-bezier(.68,-.55,.265,1.55) forwards}
.puzzle-piece.entrance-wave{animation:puzzleWave .6s ease-out forwards}
.puzzle-piece.entrance-zoom{animation:puzzleZoomIn .6s cubic-bezier(.43,.13,.23,.96) forwards}
.puzzle-piece.entrance-ghost{animation:puzzleGhost .8s ease-out forwards}

/* ── peu ────────────────────────────────────────────── */
footer.footer{flex:0 0 auto;margin-top:10px;padding:8px;text-align:center}
footer.footer p{color:var(--ink-soft);font-size:11px;margin-bottom:6px}
.footer-links{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}
.footer-links a{
  color:var(--ink);font-size:11px;text-decoration:none;opacity:.75;
  border-bottom:1px solid transparent;transition:all .2s;
}
.footer-links a:hover{opacity:1;border-bottom-color:currentColor}
.divider{color:var(--ink-soft)}

/* ═══════════════════════════════════════════════════════
   VERTICAL
   ═══════════════════════════════════════════════════════ */
body.portrait-mode{padding:max(16px,env(safe-area-inset-top)) 12px max(20px,env(safe-area-inset-bottom))}
body.portrait-mode.web-browser{padding:20px 12px 20px}
body.portrait-mode.ios-app{padding:max(52px,env(safe-area-inset-top)) 12px 20px}
body.portrait-mode.android-app{padding:max(34px,env(safe-area-inset-top)) 12px 20px}

/* ═══════════════════════════════════════════════════════
   HORITZONTAL — menú vertical al lateral
   ═══════════════════════════════════════════════════════ */
body.landscape-mode{padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
body.landscape-mode.web-browser{padding:8px 12px 12px}
body.landscape-mode.ios-app{padding:max(12px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 12px max(14px,env(safe-area-inset-left))}
body.landscape-mode.android-app{padding:max(10px,env(safe-area-inset-top)) 14px 12px}

body.landscape-mode .stage{padding:12px;border-radius:22px}

/* el menú passa a columna, enganxat a l'esquerra */
body.landscape-mode .play{flex-direction:row;gap:12px;align-items:stretch}

body.landscape-mode .bar{
  flex-direction:column;
  width:auto;flex:0 0 auto;
  padding:8px 6px;gap:7px;
  border-radius:99px;
  overflow-x:hidden;overflow-y:auto;
}
body.landscape-mode .select{
  height:44px;min-height:44px;width:44px;min-width:44px;
  padding:0;font-size:13px;border-radius:99px;
}
body.landscape-mode .spacer{min-height:4px}

/* ═══════════════════════════════════════════════════════
   PANTALLA PETITA — tot es comprimeix per deixar lloc a la foto
   El títol només desapareix aquí; en tauleta o ordinador es manté.
   ═══════════════════════════════════════════════════════ */
@media (max-height:560px), (max-width:820px){
  body.landscape-mode .brand{display:none}
  body.landscape-mode .stage{padding:8px;border-radius:18px}
  body.landscape-mode .play{gap:8px}
  body.landscape-mode .bar{padding:5px 4px;gap:5px}
  body.landscape-mode .pill{width:36px;height:36px}
  body.landscape-mode .pill .material-symbols-rounded{font-size:20px}
  body.landscape-mode .select{width:36px;min-width:36px;height:36px;min-height:36px;font-size:12px}
  body.landscape-mode .image-preview{margin-top:6px;padding:5px}
  body.landscape-mode .image-preview img{max-height:14vh}
  body.landscape-mode .log{margin-top:6px;padding:5px 12px;font-size:11px;min-height:0}
  body.landscape-mode .stats{margin-top:6px;gap:5px}
  body.landscape-mode .chip{padding:4px 10px;font-size:10px}
  body.landscape-mode .chip .material-symbols-rounded{font-size:15px}
  body.landscape-mode .chip b{font-size:12px}
  body.landscape-mode footer.footer{display:none}
}

}

<script>
/* ═══════════════════════════════════════════════════════
   REFERÈNCIES
   ═══════════════════════════════════════════════════════ */
const divisionsSelect     = document.getElementById('divisionsSelect');
const githubBtn           = document.getElementById('githubBtn');
const infoToggle          = document.getElementById('infoToggle');
const statsBar            = document.getElementById('statsBar');
const orientationLockBtn  = document.getElementById('orientationLockBtn');
const refreshBtn          = document.getElementById('refreshBtn');
const animationsToggle    = document.getElementById('animationsToggle');
const helpToggle          = document.getElementById('helpToggle');
const themeToggle         = document.getElementById('themeToggle');
const puzzleContainer     = document.getElementById('puzzleContainer');
const previewImg          = document.getElementById('previewImg');
const logDiv              = document.getElementById('log');
const victoryOverlay      = document.getElementById('victoryOverlay');
const victoryBtn          = document.getElementById('victoryBtn');
const finalImage          = document.getElementById('finalImage');
const imagePreview        = document.getElementById('imagePreview');

/* ═══════════════════════════════════════════════════════
   ESTAT
   ═══════════════════════════════════════════════════════ */
let imagenActual = null;
let divisions = 4;
let ordre = [];
let fixat = [];
let pecesDataURL = [];
let lastSource = 'picsum';
let isDifficultyMode = true;
let isAnimationsEnabled = true;
let isInfoVisible = false;
let photoWidth = 400, photoHeight = 400;
let currentCanvasWidth = 400, currentCanvasHeight = 400;
let currentPieceWidth = 100, currentPieceHeight = 100;

// Orientació i dispositiu
let currentOrientation = 'portrait';
let orientationLocked = false;
let appContext = 'web-browser';
let photoFilter = 'thumbnail';

// Gestió de fotos sense repeticions
let allPhotos = [];
let playedPhotos = [];
let currentPhotoIndex = -1;

// Estadístiques
let photosPlayed = 0;
let gamesPlayed = 0;
let totalPhotos = 0;
let gitHubPhotosCount = 0;

const animationTypes = [
  'entrance-spin','entrance-fall','entrance-explosion','entrance-flip',
  'entrance-slide','entrance-slide-right','entrance-bounce','entrance-wave',
  'entrance-zoom','entrance-ghost'
];

/* Canvia la icona d'un botó */
function setIcon(btn, name){
  btn.querySelector('.material-symbols-rounded').textContent = name;
}

/* ═══════════════════════════════════════════════════════
   MIDA DEL TAULER
   Mesura l'espai lliure i hi encaixa la foto a la seva
   proporció exacta, sense deformar-la.
   ═══════════════════════════════════════════════════════ */
const boardWrap = document.querySelector('.board-wrap');

function ajustarTauler(){
  if (!currentCanvasWidth || !currentCanvasHeight) return;

  const r = boardWrap.getBoundingClientRect();
  let availW = r.width;
  let availH = r.height;

  // Xarxa de seguretat si encara no s'ha fet el càlcul de disposició
  if (availW < 40) availW = window.innerWidth  * 0.9;
  if (availH < 40) availH = window.innerHeight * 0.5;

  const ratio = currentCanvasWidth / currentCanvasHeight;

  let w = availW;
  let h = w / ratio;
  if (h > availH){ h = availH; w = h * ratio; }

  puzzleContainer.style.width  = Math.floor(w) + 'px';
  puzzleContainer.style.height = Math.floor(h) + 'px';
}

function log(msg){
  console.log(msg);
  logDiv.textContent = msg;
}

/* ═══════════════════════════════════════════════════════
   TEMA
   ═══════════════════════════════════════════════════════ */
function initTheme(){
  const isDark = localStorage.getItem('darkMode') === 'true';
  document.body.classList.toggle('day', !isDark);
  setIcon(themeToggle, isDark ? 'light_mode' : 'dark_mode');
}

themeToggle.addEventListener('click', () => {
  const isDark = document.body.classList.toggle('day') === false;
  localStorage.setItem('darkMode', isDark);
  setIcon(themeToggle, isDark ? 'light_mode' : 'dark_mode');
});

/* ═══════════════════════════════════════════════════════
   AJUDA VISUAL
   ═══════════════════════════════════════════════════════ */
function applyHelpState(){
  if (isDifficultyMode){
    setIcon(helpToggle, 'lightbulb');
    helpToggle.classList.remove('on');
    imagePreview.classList.add('hidden');
  } else {
    setIcon(helpToggle, 'lightbulb');
    helpToggle.classList.add('on');
    imagePreview.classList.remove('hidden');
  }
}

helpToggle.addEventListener('click', () => {
  isDifficultyMode = !isDifficultyMode;
  applyHelpState();
  ajustarTauler();
  log(isDifficultyMode ? 'Ajuda amagada' : 'Ajuda visible');
});

/* ═══════════════════════════════════════════════════════
   ANIMACIONS
   ═══════════════════════════════════════════════════════ */
function initAnimations(){
  isAnimationsEnabled = localStorage.getItem('enableAnimations') !== 'false';
  updateAnimationsButton();
}
function updateAnimationsButton(){
  animationsToggle.classList.toggle('off', !isAnimationsEnabled);
}
animationsToggle.addEventListener('click', () => {
  isAnimationsEnabled = !isAnimationsEnabled;
  localStorage.setItem('enableAnimations', isAnimationsEnabled);
  updateAnimationsButton();
  log(isAnimationsEnabled ? 'Animacions activades' : 'Animacions desactivades');
});
function getRandomAnimation(){
  return animationTypes[Math.floor(Math.random() * animationTypes.length)];
}

/* ═══════════════════════════════════════════════════════
   DETECCIÓ DE CONTEXT I ORIENTACIÓ
   ═══════════════════════════════════════════════════════ */
function detectAppContext(){
  if (navigator.standalone === true) appContext = 'ios-app';
  else if (window.matchMedia('(display-mode: standalone)').matches) appContext = 'android-app';
  else appContext = 'web-browser';
  console.log('Context:', appContext);
}

function applyContextStyles(){
  document.body.classList.remove('web-browser','ios-app','android-app');
  document.body.classList.add(appContext);
}

function detectOrientation(){
  if (orientationLocked) return;
  const isPortrait = window.innerWidth < window.innerHeight;
  const newOrientation = isPortrait ? 'portrait' : 'landscape';
  if (newOrientation !== currentOrientation){
    currentOrientation = newOrientation;
    photoFilter = isPortrait ? 'thumbnail' : 'hthumbnail';
    // El llistat de fotos jugades depèn del filtre: cal reiniciar-lo
    allPhotos = [];
    playedPhotos = [];
    console.log('Orientació:', currentOrientation, '→ filtre:', photoFilter);
    applyOrientationStyles();
    updateStats();
  }
}

function applyOrientationStyles(){
  document.body.classList.remove('portrait-mode','landscape-mode');
  document.body.classList.add(currentOrientation === 'portrait' ? 'portrait-mode' : 'landscape-mode');
}

function toggleOrientationLock(){
  orientationLocked = !orientationLocked;
  localStorage.setItem('orientationLocked', orientationLocked);
  localStorage.setItem('preferredOrientation', currentOrientation);
  applyLockState();
  log(orientationLocked
    ? `Orientació fixada en ${currentOrientation === 'portrait' ? 'vertical' : 'horitzontal'}`
    : 'Orientació automàtica');
}

function applyLockState(){
  setIcon(orientationLockBtn, orientationLocked ? 'lock' : 'lock_open');
  orientationLockBtn.classList.toggle('on', orientationLocked);
}

orientationLockBtn.addEventListener('click', toggleOrientationLock);

function getDeviceInfo(){
  return {
    orientation: currentOrientation,
    width: window.innerWidth,
    height: window.innerHeight,
    isMobile: /iPhone|iPad|Android/.test(navigator.userAgent),
    isTablet: window.innerWidth > 768,
    pixelRatio: window.devicePixelRatio,
    appContext
  };
}

/* ═══════════════════════════════════════════════════════
   ESTADÍSTIQUES
   ═══════════════════════════════════════════════════════ */
function updateStats(){
  document.getElementById('photosPlayed').textContent = photosPlayed;
  document.getElementById('gamesPlayed').textContent  = gamesPlayed;

  const srcIcon  = document.getElementById('sourceIcon');
  const srcLabel = document.getElementById('currentSource');

  if (lastSource === 'github'){
    totalPhotos = gitHubPhotosCount || '∞';
    srcIcon.textContent = 'photo_library';
    srcIcon.style.color = '#22c55e';
    srcLabel.textContent = '\u00A9 Gerard M.';
  } else {
    totalPhotos = '∞';
    srcIcon.textContent = 'travel_explore';
    srcIcon.style.color = '#0ea5e9';
    srcLabel.textContent = 'Internet';
  }
  document.getElementById('totalPhotos').textContent = totalPhotos;

  const orIcon  = document.getElementById('orientIcon');
  const orLabel = document.getElementById('orientLabel');
  if (currentOrientation === 'portrait'){
    orIcon.textContent = 'stay_current_portrait';
    orLabel.textContent = 'Vertical';
  } else {
    orIcon.textContent = 'stay_current_landscape';
    orLabel.textContent = 'Horitzontal';
  }
}

function incrementPhotosPlayed(){ photosPlayed++; updateStats(); }
function incrementGamesPlayed(){ gamesPlayed++; updateStats(); }

/* ═══════════════════════════════════════════════════════
   SELECCIÓ DE FOTO SENSE REPETICIONS
   ═══════════════════════════════════════════════════════ */
function getNextPhoto(fotos){
  const filteredPhotos = fotos.filter(f => f.startsWith(photoFilter));
  const otherFilter    = photoFilter === 'thumbnail' ? 'hthumbnail' : 'thumbnail';
  const otherPhotos    = fotos.filter(f => f.startsWith(otherFilter));

  if (filteredPhotos.length === 0){
    const actual = currentOrientation === 'portrait' ? 'vertical' : 'horitzontal';
    const altra  = currentOrientation === 'portrait' ? 'horitzontal' : 'vertical';
    if (otherPhotos.length > 0){
      log(`No hi ha cap foto teva en ${actual} (només en ${altra}). Agafem una foto d'Internet.`);
    } else {
      log('No hi ha cap foto teva. Agafem una foto d\'Internet.');
    }
    return null;
  }

  if (!allPhotos || allPhotos.length === 0){
    allPhotos = [...filteredPhotos];
    playedPhotos = [];
  }

  // Totes jugades → tornem a començar
  if (playedPhotos.length >= filteredPhotos.length){
    log('Ja les has vist totes. Tornem a començar.');
    allPhotos = [...filteredPhotos];
    playedPhotos = [];
  }

  // Candidates = les que encara no han sortit. Tria directa, sense sortejos repetits.
  const candidates = filteredPhotos.filter(f => !playedPhotos.includes(f));
  if (candidates.length === 0) return null;

  const randomPhoto = candidates[Math.floor(Math.random() * candidates.length)];
  playedPhotos.push(randomPhoto);
  currentPhotoIndex = filteredPhotos.indexOf(randomPhoto);
  return randomPhoto;
}

/* ═══════════════════════════════════════════════════════
   CÀRREGA D'IMATGES
   ═══════════════════════════════════════════════════════ */
function cargarImagenDesdeUrl(imageUrl, source){
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => {
    imagenActual = imageUrl;
    photoWidth  = img.naturalWidth;
    photoHeight = img.naturalHeight;
    previewImg.onload = () => { log('Foto carregada'); iniciarPuzzle(); };
    previewImg.src = imageUrl;
    finalImage.src = imageUrl;
  };
  img.onerror = () => log('No s\'ha pogut carregar la foto');
  img.src = imageUrl;
}

function carregarImagenAleatoria(){
  log('Carregant imatge…');
  const seed = Math.floor(Math.random() * 1000000);
  // Demanem la imatge amb la proporció que toca segons l'orientació
  const mides = currentOrientation === 'portrait' ? '600/800' : '800/600';
  const imageUrl = `https://picsum.photos/seed/puzzle${seed}/${mides}`;
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => {
    imagenActual = imageUrl;
    photoWidth  = img.naturalWidth;
    photoHeight = img.naturalHeight;
    previewImg.onload = () => {
      log('Imatge carregada');
      incrementPhotosPlayed();
      iniciarPuzzle();
    };
    previewImg.src = imageUrl;
    finalImage.src = imageUrl;
  };
  img.onerror = () => log('No s\'ha pogut carregar. Torna-ho a provar.');
  img.src = imageUrl;
}

async function carregarFotosGitHub(){
  log('Carregant les teves fotos…');
  try{
    const response = await fetch('Fotos/fotos.json');
    if (!response.ok){
      log('No hi ha fotos teves. Agafem una foto d\'Internet.');
      return recorrerAInternet();
    }

    const data  = await response.json();
    const fotos = data.fotos;
    if (!fotos || fotos.length === 0){
      log('No hi ha fotos teves. Agafem una foto d\'Internet.');
      return recorrerAInternet();
    }

    gitHubPhotosCount = fotos.filter(f => f.startsWith(photoFilter)).length;

    const fotoAleatoria = getNextPhoto(fotos);
    if (!fotoAleatoria) return recorrerAInternet();  // getNextPhoto ja ha avisat

    lastSource = 'github';
    updateStats();
    log(`${fotoAleatoria} · ${playedPhotos.length}/${gitHubPhotosCount}`);
    incrementPhotosPlayed();
    cargarImagenDesdeUrl(`Fotos/${fotoAleatoria}`, 'github');

  } catch(err){
    log('No s\'han pogut llegir les teves fotos. Agafem una d\'Internet.');
    recorrerAInternet();
  }
}

/* Recanvi: només s'hi arriba quan no hi ha cap foto local utilitzable */
function recorrerAInternet(){
  lastSource = 'picsum';
  updateStats();
  carregarImagenAleatoria();
}

/* Sempre provem primer les fotos locals; el recanvi ja el decideix la funció */
function carregarUltima(){
  carregarFotosGitHub();
}

// El botó està comentat a l'HTML: només hi afegim l'event si existeix
if (githubBtn){
  githubBtn.addEventListener('click', () => {
    puzzleContainer.innerHTML = '';
    carregarUltima();
  });
}

/* Informació: les estadístiques només es veuen si es demanen */
function applyInfoState(){
  statsBar.classList.toggle('hidden', !isInfoVisible);
  infoToggle.classList.toggle('on', isInfoVisible);
}

infoToggle.addEventListener('click', () => {
  isInfoVisible = !isInfoVisible;
  localStorage.setItem('showInfo', isInfoVisible);
  applyInfoState();
  ajustarTauler();
});

refreshBtn.addEventListener('click', () => {
  puzzleContainer.innerHTML = '';
  carregarUltima();
});

/* ═══════════════════════════════════════════════════════
   CONSTRUCCIÓ DEL TRENCACLOSQUES
   ═══════════════════════════════════════════════════════ */
function iniciarPuzzle(){
  if (!imagenActual){ log('Carrega una imatge primer'); return; }

  divisions = parseInt(divisionsSelect.value);
  const total = divisions * divisions;
  log(`Creant trencaclosques ${divisions}×${divisions}…`);

  const maxCanvasWidth = 800, maxCanvasHeight = 800;
  let canvasWidth = photoWidth, canvasHeight = photoHeight;

  if (canvasWidth > maxCanvasWidth || canvasHeight > maxCanvasHeight){
    const scale = Math.min(maxCanvasWidth / canvasWidth, maxCanvasHeight / canvasHeight);
    canvasWidth  *= scale;
    canvasHeight *= scale;
  }

  const canvas = document.createElement('canvas');
  canvas.width = canvasWidth;
  canvas.height = canvasHeight;
  const ctx = canvas.getContext('2d');

  try{
    ctx.drawImage(previewImg, 0, 0, canvasWidth, canvasHeight);
  } catch(e){
    log('No s\'ha pogut dibuixar la imatge');
    return;
  }

  pecesDataURL = [];
  const pieceWidth  = canvasWidth / divisions;
  const pieceHeight = canvasHeight / divisions;

  for (let row = 0; row < divisions; row++){
    for (let col = 0; col < divisions; col++){
      const pieceCanvas = document.createElement('canvas');
      pieceCanvas.width  = pieceWidth;
      pieceCanvas.height = pieceHeight;
      pieceCanvas.getContext('2d').drawImage(
        canvas,
        col * pieceWidth, row * pieceHeight, pieceWidth, pieceHeight,
        0, 0, pieceWidth, pieceHeight
      );
      pecesDataURL.push(pieceCanvas.toDataURL());
    }
  }

  ordre = Array.from({length: total}, (_, i) => i);
  for (let i = total - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [ordre[i], ordre[j]] = [ordre[j], ordre[i]];
  }
  fixat = new Array(total).fill(false);

  currentCanvasWidth  = canvasWidth;
  currentCanvasHeight = canvasHeight;
  currentPieceWidth   = pieceWidth;
  currentPieceHeight  = pieceHeight;

  // Mostrem la foto sencera abans de trencar-la
  puzzleContainer.innerHTML = '';
  puzzleContainer.style.gridTemplateColumns = '1fr';
  puzzleContainer.style.aspectRatio = `${canvasWidth} / ${canvasHeight}`;
  ajustarTauler();

  const senceraDiv = document.createElement('div');
  senceraDiv.style.width = '100%';
  senceraDiv.style.height = '100%';
  senceraDiv.style.backgroundImage = `url('${imagenActual}')`;
  senceraDiv.style.backgroundSize = '100% 100%';
  senceraDiv.style.borderRadius = '14px';
  puzzleContainer.appendChild(senceraDiv);

  if (!isDifficultyMode) imagePreview.classList.remove('hidden');
  log('Memoritza la imatge…');

  setTimeout(() => {
    renderitzarPuzzle(true, canvasWidth, canvasHeight, pieceWidth, pieceHeight);
    log('Arrossega les peces!');
  }, 2500);
}

function renderitzarPuzzle(animate = false, canvasWidth = null, canvasHeight = null, pieceWidth = null, pieceHeight = null){
  if (canvasWidth  === null) canvasWidth  = currentCanvasWidth;
  if (canvasHeight === null) canvasHeight = currentCanvasHeight;
  if (pieceWidth   === null) pieceWidth   = currentPieceWidth;
  if (pieceHeight  === null) pieceHeight  = currentPieceHeight;

  const total = divisions * divisions;
  puzzleContainer.innerHTML = '';
  puzzleContainer.style.gridTemplateColumns = `repeat(${divisions}, 1fr)`;
  puzzleContainer.style.aspectRatio = `${canvasWidth} / ${canvasHeight}`;
  ajustarTauler();

  for (let i = 0; i < total; i++){
    const pecaIndex = ordre[i];
    const piece = document.createElement('div');
    piece.className = 'puzzle-piece';
    piece.classList.add(fixat[i] ? 'fixed' : 'unfixed');
    piece.style.backgroundImage = `url('${pecesDataURL[pecaIndex]}')`;
    piece.style.backgroundSize = '100% 100%';
    piece.dataset.posicio = i;

    if (animate && isAnimationsEnabled){
      piece.classList.add(getRandomAnimation());
      piece.style.animationDelay = (i * 0.05) + 's';
    }

    if (!fixat[i]){
      piece.draggable = true;
      piece.addEventListener('dragstart', handleDragStart);
      piece.addEventListener('dragover',  handleDragOver);
      piece.addEventListener('drop',      handleDrop);
      piece.addEventListener('dragend',   handleDragEnd);
      piece.addEventListener('touchstart',handleTouchStart);
      piece.addEventListener('touchmove', handleTouchMove);
      piece.addEventListener('touchend',  handleTouchEnd);
    }
    puzzleContainer.appendChild(piece);
  }
}

/* ═══════════════════════════════════════════════════════
   ARROSSEGAR — ratolí
   ═══════════════════════════════════════════════════════ */
let origenIndex = null;

function handleDragStart(e){
  origenIndex = parseInt(e.target.dataset.posicio);
  e.dataTransfer.effectAllowed = 'move';
  e.target.style.opacity = '0.5';
}
function handleDragOver(e){ e.preventDefault(); e.dataTransfer.dropEffect = 'move'; }
function handleDrop(e){
  e.preventDefault();
  const destiPiece = e.target.closest('.puzzle-piece');
  if (!destiPiece || fixat[destiPiece.dataset.posicio]) return;
  const destiIndex = parseInt(destiPiece.dataset.posicio);
  if (origenIndex === null || origenIndex === destiIndex) return;
  [ordre[origenIndex], ordre[destiIndex]] = [ordre[destiIndex], ordre[origenIndex]];
  for (let i = 0; i < ordre.length; i++) fixat[i] = (ordre[i] === i);
  renderitzarPuzzle(false);
  comprovarVictoria();
  origenIndex = null;
}
function handleDragEnd(e){ e.target.style.opacity = '1'; }

/* ═══════════════════════════════════════════════════════
   ARROSSEGAR — tàctil
   ═══════════════════════════════════════════════════════ */
let touchPiece = null;
let floatingClone = null;

function handleTouchStart(e){
  touchPiece = e.target.closest('.puzzle-piece');
  if (!touchPiece || fixat[touchPiece.dataset.posicio]) return;
  floatingClone = touchPiece.cloneNode(true);
  floatingClone.style.position = 'fixed';
  floatingClone.style.zIndex = '1001';
  floatingClone.style.pointerEvents = 'none';
  floatingClone.style.boxShadow = '0 0 0 3px rgba(255,209,102,.9), 0 12px 26px rgba(0,0,0,.5)';
  floatingClone.classList.add('unfixed');
  const rect = touchPiece.getBoundingClientRect();
  floatingClone.style.left = rect.left + 'px';
  floatingClone.style.top = rect.top + 'px';
  floatingClone.style.width = rect.width + 'px';
  floatingClone.style.height = rect.height + 'px';
  document.body.appendChild(floatingClone);
  touchPiece.style.opacity = '0.3';
}

function handleTouchMove(e){
  if (!floatingClone) return;
  e.preventDefault();
  const touch = e.touches[0];
  const rect = floatingClone.getBoundingClientRect();
  floatingClone.style.left = (touch.clientX - rect.width / 2) + 'px';
  floatingClone.style.top  = (touch.clientY - rect.height / 2) + 'px';
}

function handleTouchEnd(e){
  if (!touchPiece || !floatingClone) return;
  const touch = e.changedTouches[0];
  const targetElement = document.elementFromPoint(touch.clientX, touch.clientY);
  const destiPiece = targetElement ? targetElement.closest('.puzzle-piece') : null;

  if (destiPiece && destiPiece !== touchPiece && !fixat[destiPiece.dataset.posicio]){
    const origen = parseInt(touchPiece.dataset.posicio);
    const desti  = parseInt(destiPiece.dataset.posicio);
    [ordre[origen], ordre[desti]] = [ordre[desti], ordre[origen]];
    for (let i = 0; i < ordre.length; i++) fixat[i] = (ordre[i] === i);
    renderitzarPuzzle(false);
    comprovarVictoria();
  } else {
    touchPiece.style.opacity = '1';
  }
  document.body.removeChild(floatingClone);
  floatingClone = null;
  touchPiece = null;
}

/* ═══════════════════════════════════════════════════════
   VICTÒRIA
   ═══════════════════════════════════════════════════════ */
function comprovarVictoria(){
  if (fixat.every(v => v === true)){
    log('Visca!');
    incrementGamesPlayed();          // només compta si s'ha resolt
    victoryOverlay.classList.add('active');
  } else {
    const correctes = fixat.filter(v => v).length;
    log(`${correctes}/${ordre.length} peces al seu lloc`);
  }
}

victoryBtn.addEventListener('click', () => {
  victoryOverlay.classList.remove('active');
  puzzleContainer.innerHTML = '';
  carregarUltima();
});

function actualitzarEtiquetaDivisions(){
  const opcio = divisionsSelect.options[divisionsSelect.selectedIndex];
  document.getElementById('divisionsLabel').textContent = opcio ? opcio.text : '';
}

divisionsSelect.addEventListener('change', () => {
  actualitzarEtiquetaDivisions();
  if (imagenActual) iniciarPuzzle();
});

/* ═══════════════════════════════════════════════════════
   ORIENTACIÓ EN VIU
   ═══════════════════════════════════════════════════════ */
window.addEventListener('resize', () => { detectOrientation(); ajustarTauler(); });
window.addEventListener('orientationchange', () => setTimeout(() => {
  detectOrientation(); ajustarTauler();
}, 120));

/* ═══════════════════════════════════════════════════════
   ARRENCADA
   ═══════════════════════════════════════════════════════ */
initTheme();
initAnimations();
applyHelpState();
actualitzarEtiquetaDivisions();

isInfoVisible = localStorage.getItem('showInfo') === 'true';
applyInfoState();

detectAppContext();
applyContextStyles();

// Recuperem el bloqueig abans de detectar, perquè mani la preferència desada
orientationLocked = localStorage.getItem('orientationLocked') === 'true';
if (orientationLocked){
  const saved = localStorage.getItem('preferredOrientation') || 'portrait';
  currentOrientation = saved;
  photoFilter = saved === 'portrait' ? 'thumbnail' : 'hthumbnail';
} else {
  currentOrientation = window.innerWidth < window.innerHeight ? 'portrait' : 'landscape';
  photoFilter = currentOrientation === 'portrait' ? 'thumbnail' : 'hthumbnail';
}
applyLockState();
applyOrientationStyles();
updateStats();

carregarFotosGitHub();
</script>
