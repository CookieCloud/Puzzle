<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzle Art</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #667eea;
        }
        button {
            display: block;
            width: 100%;
            padding: 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
            transition: background 0.2s, transform 0.1s;
        }
        button:active {
            background: #5568d3;
            transform: scale(0.98);
        }
        .controls {
            text-align: center;
            margin-bottom: 20px;
        }
        select {
            padding: 8px 12px;
            border-radius: 6px;
            border: 2px solid #667eea;
            font-size: 14px;
            background: white;
        }
        .puzzle-grid {
            display: grid;
            gap: 0;
            margin-bottom: 20px;
            background: #d0d0d0;
            padding: 4px;
            border-radius: 8px;
            aspect-ratio: 1 / 1;
            width: 100%;
        }
        .puzzle-piece {
            background-size: 400px 400px;
            background-position: center;
            border-radius: 2px;
            cursor: grab;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            position: relative;
        }
        .puzzle-piece.unfixed {
            margin: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }
        .puzzle-piece.fixed {
            margin: 0;
            box-shadow: none;
            cursor: default;
            border-radius: 0;
        }
        .puzzle-piece:active:not(.fixed) {
            cursor: grabbing;
            opacity: 0.8;
            z-index: 100;
        }
        .image-preview {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .image-preview img {
            max-width: 100%;
            max-height: 250px;
            border-radius: 6px;
        }
        .image-preview .placeholder {
            color: #999;
            font-style: italic;
        }
        .log {
            background: #f0f0f0;
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            color: #666;
            min-height: 1.5em;
        }
        .victory-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }
        .victory-overlay.active {
            display: flex;
        }
        .victory-popup {
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            animation: popIn 0.4s ease-out;
            max-width: 90%;
        }
        .victory-popup h2 {
            font-size: 2.5rem;
            color: #667eea;
            margin-bottom: 10px;
        }
        .victory-popup p {
            font-size: 1.1rem;
            color: #333;
            margin-bottom: 25px;
        }
        .victory-popup .final-puzzle {
            margin: 20px 0;
            border-radius: 12px;
            max-width: 300px;
            margin-left: auto;
            margin-right: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .victory-popup button {
            display: inline-block;
            width: auto;
            padding: 12px 40px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 15px;
        }
        .victory-popup button:active {
            background: #5568d3;
            transform: scale(0.98);
        }
        @keyframes popIn {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧩 Puzzle Art</h1>
        <button id="carregarBtn">Carregar Imatge Nova</button>
        <div class="controls">
            <label>Divisions:
                <select id="divisionsSelect">
                    <option value="2">2×2 (4 peces)</option>
                    <option value="3">3×3 (9 peces)</option>
                    <option value="4" selected>4×4 (16 peces)</option>
                    <option value="5">5×5 (25 peces)</option>
                </select>
            </label>
        </div>
        <div id="puzzleContainer" class="puzzle-grid"></div>
        <div id="imagePreview" class="image-preview">
            <span class="placeholder">Carregant imatge...</span>
        </div>
        <div class="log" id="log">Esperant acció...</div>
    </div>

    <div id="victoryOverlay" class="victory-overlay">
        <div class="victory-popup">
            <h2>🎉 ¡VICTÒRIA!</h2>
            <p>Has completat el puzzle!</p>
            <img id="finalImage" class="final-puzzle" src="" alt="Puzzle completat">
            <br>
            <button id="victoryBtn">Jugar de Nou</button>
        </div>
    </div>

    <script>
        const carregarBtn = document.getElementById('carregarBtn');
        const puzzleContainer = document.getElementById('puzzleContainer');
        const imagePreview = document.getElementById('imagePreview');
        const divisionsSelect = document.getElementById('divisionsSelect');
        const logDiv = document.getElementById('log');
        const victoryOverlay = document.getElementById('victoryOverlay');
        const victoryBtn = document.getElementById('victoryBtn');
        const finalImage = document.getElementById('finalImage');

        let imagenActual = null;
        let divisions = 4;
        let ordre = [];
        let fixat = [];
        let imageWidth = 400;
        let imageHeight = 400;

        function log(msg) {
            console.log(msg);
            logDiv.textContent = msg;
        }

        function generarImatgeReserva() {
            const canvas = document.createElement('canvas');
            canvas.width = 400;
            canvas.height = 400;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createLinearGradient(0, 0, 400, 400);
            gradient.addColorStop(0, '#ff6b6b');
            gradient.addColorStop(0.5, '#feca57');
            gradient.addColorStop(1, '#48dbfb');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 400, 400);
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.beginPath();
            ctx.arc(200, 200, 120, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.font = 'bold 40px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🎨', 200, 200);
            return canvas.toDataURL('image/png');
        }

        function carregarImagenAleatoria() {
            log('🔄 Carregant imatge...');
            imagePreview.innerHTML = '<span class="placeholder">Carregant...</span>';
            const seed = Math.floor(Math.random() * 1000000);
            const imageUrl = `https://picsum.photos/seed/${seed}/400/400`;
            
            const img = new Image();
            img.crossOrigin = 'anonymous';
            let carregada = false;

            img.onload = function() {
                carregada = true;
                imageWidth = 400;
                imageHeight = 400;
                log(`✅ Imatge carregada`);
                imagenActual = imageUrl;
                finalImage.src = imageUrl;
                mostrarImatge();
                iniciarPuzzle();
            };

            img.onerror = function() {
                log('❌ Error. Usant imatge de reserva.');
                const fallback = generarImatgeReserva();
                imagenActual = fallback;
                finalImage.src = fallback;
                imageWidth = 400;
                imageHeight = 400;
                mostrarImatge();
                iniciarPuzzle();
            };

            const timeout = setTimeout(() => {
                if (!carregada) {
                    log('⏱️ Temps d\'espera excedit.');
                    const fallback = generarImatgeReserva();
                    imagenActual = fallback;
                    finalImage.src = fallback;
                    imageWidth = 400;
                    imageHeight = 400;
                    mostrarImatge();
                    iniciarPuzzle();
                }
            }, 8000);

            img.addEventListener('load', () => clearTimeout(timeout));
            img.addEventListener('error', () => clearTimeout(timeout));
            img.src = imageUrl;
        }

        function mostrarImatge() {
            if (imagenActual) {
                imagePreview.innerHTML = `<img src="${imagenActual}" alt="Imatge original">`;
            }
        }

        function iniciarPuzzle() {
            if (!imagenActual) {
                log('⚠️ No hi ha imatge vàlida.');
                return;
            }

            divisions = parseInt(divisionsSelect.value);
            const total = divisions * divisions;
            log(`📦 Puzzle ${divisions}×${divisions} (${total} peces)`);

            ordre = Array.from({ length: total }, (_, i) => i);
            for (let i = total - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [ordre[i], ordre[j]] = [ordre[j], ordre[i]];
            }

            fixat = new Array(total).fill(false);
            renderitzarPuzzle();
        }

        function renderitzarPuzzle() {
            if (!imagenActual) return;

            const total = divisions * divisions;
            const pieceWidth = imageWidth / divisions;
            const pieceHeight = imageHeight / divisions;

            puzzleContainer.innerHTML = '';
            puzzleContainer.style.gridTemplateColumns = `repeat(${divisions}, 1fr)`;

            for (let i = 0; i < total; i++) {
                const pecaIndex = ordre[i];
                const fila = Math.floor(pecaIndex / divisions);
                const columna = pecaIndex % divisions;

                const offsetX = columna * pieceWidth;
                const offsetY = fila * pieceHeight;

                const piece = document.createElement('div');
                piece.className = 'puzzle-piece';

                if (fixat[i]) {
                    piece.classList.add('fixed');
                } else {
                    piece.classList.add('unfixed');
                }

                piece.style.backgroundImage = `url('${imagenActual}')`;
                piece.style.backgroundSize = `${imageWidth}px ${imageHeight}px`;
                piece.style.backgroundPosition = `-${offsetX}px -${offsetY}px`;

                piece.dataset.posicio = i;
                piece.dataset.correcta = pecaIndex;

                if (!fixat[i]) {
                    piece.draggable = true;
                    piece.addEventListener('dragstart', handleDragStart);
                    piece.addEventListener('dragover', handleDragOver);
                    piece.addEventListener('drop', handleDrop);
                    piece.addEventListener('dragend', handleDragEnd);
                }

                puzzleContainer.appendChild(piece);
            }
        }

        let origenIndex = null;

        function handleDragStart(e) {
            const piece = e.target;
            origenIndex = parseInt(piece.dataset.posicio);
            e.dataTransfer.effectAllowed = 'move';
            piece.style.opacity = '0.5';
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        }

        function handleDrop(e) {
            e.preventDefault();
            const destiPiece = e.target.closest('.puzzle-piece');
            if (!destiPiece || fixat[destiPiece.dataset.posicio]) return;

            const destiIndex = parseInt(destiPiece.dataset.posicio);
            if (origenIndex === null || origenIndex === destiIndex) return;

            // Intercanviar
            [ordre[origenIndex], ordre[destiIndex]] = [ordre[destiIndex], ordre[origenIndex]];

            // Actualitzar fixat
            for (let i = 0; i < ordre.length; i++) {
                fixat[i] = (ordre[i] === i);
            }

            renderitzarPuzzle();

            // Verificar victòria
            const totsFixats = fixat.every(v => v === true);
            if (totsFixats) {
                log('🎉 ¡VICTÒRIA! Puzzle completat!');
                mostrarPopupVictoria();
            } else {
                const correctes = fixat.filter(v => v).length;
                log(`🧩 ${correctes}/${ordre.length} peces correctes`);
            }

            origenIndex = null;
        }

        function handleDragEnd(e) {
            e.target.style.opacity = '1';
        }

        function mostrarPopupVictoria() {
            victoryOverlay.classList.add('active');
        }

        function amagarPopupVictoria() {
            victoryOverlay.classList.remove('active');
        }

        victoryBtn.addEventListener('click', () => {
            amagarPopupVictoria();
            carregarImagenAleatoria();
        });

        carregarBtn.addEventListener('click', carregarImagenAleatoria);

        divisionsSelect.addEventListener('change', () => {
            if (imagenActual) {
                iniciarPuzzle();
            }
        });

        carregarImagenAleatoria();
    </script>
</body>
</html>
