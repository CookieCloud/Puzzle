<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzle Art</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #667eea;
        }
        button {
            display: block;
            width: 100%;
            padding: 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
            transition: background 0.2s;
        }
        button:active {
            background: #5568d3;
            transform: scale(0.98);
        }
        .controls {
            text-align: center;
            margin-bottom: 20px;
        }
        select {
            padding: 8px 12px;
            border-radius: 6px;
            border: 2px solid #667eea;
            font-size: 14px;
        }
        .puzzle-grid {
            display: grid;
            gap: 0;
            margin-bottom: 20px;
            background: #d0d0d0;
            padding: 4px;
            border-radius: 8px;
            aspect-ratio: 1 / 1;
            width: 100%;
        }
        .puzzle-piece {
            background-size: cover;
            background-position: center;
            cursor: grab;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            position: relative;
        }
        .puzzle-piece.unfixed {
            margin: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            border-radius: 2px;
        }
        .puzzle-piece.fixed {
            margin: 0;
            box-shadow: none;
            cursor: default;
            border-radius: 0;
        }
        .puzzle-piece:active:not(.fixed) {
            cursor: grabbing;
            opacity: 0.8;
            z-index: 100;
        }
        .image-preview {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .image-preview img {
            max-width: 100%;
            max-height: 250px;
            border-radius: 6px;
        }
        .log {
            background: #f0f0f0;
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            color: #666;
        }
        .victory-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }
        .victory-overlay.active {
            display: flex;
        }
        .victory-popup {
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            animation: popIn 0.4s ease-out;
            max-width: 90%;
        }
        .victory-popup h2 {
            font-size: 2.5rem;
            color: #667eea;
            margin-bottom: 10px;
        }
        .victory-popup p {
            font-size: 1.1rem;
            color: #333;
            margin-bottom: 20px;
        }
        .victory-popup .final-puzzle {
            margin: 20px 0;
            border-radius: 12px;
            max-width: 300px;
            margin-left: auto;
            margin-right: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .victory-popup button {
            display: inline-block;
            width: auto;
            padding: 12px 40px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 15px;
        }
        .victory-popup button:active {
            background: #5568d3;
            transform: scale(0.98);
        }
        @keyframes popIn {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧩 Puzzle Art</h1>
        <button id="carregarBtn">Carregar Imatge Nova</button>
        <div class="controls">
            <label>Divisions:
                <select id="divisionsSelect">
                    <option value="2">2×2 (4 peces)</option>
                    <option value="3">3×3 (9 peces)</option>
                    <option value="4" selected>4×4 (16 peces)</option>
                    <option value="5">5×5 (25 peces)</option>
                </select>
            </label>
        </div>
        <div id="puzzleContainer" class="puzzle-grid"></div>
        <div id="imagePreview" class="image-preview">
            <img id="previewImg" src="" alt="Original">
        </div>
        <div class="log" id="log">Carregant...</div>
    </div>

    <div id="victoryOverlay" class="victory-overlay">
        <div class="victory-popup">
            <h2>🎉 ¡VICTÒRIA!</h2>
            <p>Has completat el puzzle!</p>
            <img id="finalImage" class="final-puzzle" src="" alt="Puzzle completat">
            <br>
            <button id="victoryBtn">Jugar de Nou</button>
        </div>
    </div>

    <script>
        const carregarBtn = document.getElementById('carregarBtn');
        const puzzleContainer = document.getElementById('puzzleContainer');
        const previewImg = document.getElementById('previewImg');
        const divisionsSelect = document.getElementById('divisionsSelect');
        const logDiv = document.getElementById('log');
        const victoryOverlay = document.getElementById('victoryOverlay');
        const victoryBtn = document.getElementById('victoryBtn');
        const finalImage = document.getElementById('finalImage');

        let imagenActual = null;
        let divisions = 4;
        let ordre = [];
        let fixat = [];
        let pecesDataURL = [];

        function log(msg) {
            console.log(msg);
            logDiv.textContent = msg;
        }

        function carregarImagenAleatoria() {
            log('🔄 Carregant imatge...');
            const seed = Math.floor(Math.random() * 1000000);
            const imageUrl = `https://picsum.photos/seed/${seed}/400/400`;
            
            const img = new Image();
            img.crossOrigin = 'anonymous';

            img.onload = function() {
                log('✅ Imatge carregada');
                imagenActual = imageUrl;
                previewImg.src = imageUrl;
                finalImage.src = imageUrl;
                iniciarPuzzle();
            };

            img.onerror = function() {
                log('❌ Error al carregar. Intenta de nou.');
            };

            img.src = imageUrl;
        }

        function iniciarPuzzle() {
            divisions = parseInt(divisionsSelect.value);
            const total = divisions * divisions;
            
            log(`📦 Creant puzzle ${divisions}×${divisions}...`);

            // Crear canvas i dibuixar la imatge
            const canvas = document.createElement('canvas');
            canvas.width = 400;
            canvas.height = 400;
            const ctx = canvas.getContext('2d');

            const img = new Image();
            img.crossOrigin = 'anonymous';

            img.onload = function() {
                ctx.drawImage(img, 0, 0, 400, 400);
                
                // Extreure les peces
                pecesDataURL = [];
                const pieceSize = 400 / divisions;

                for (let row = 0; row < divisions; row++) {
                    for (let col = 0; col < divisions; col++) {
                        const pieceCanvas = document.createElement('canvas');
                        pieceCanvas.width = pieceSize;
                        pieceCanvas.height = pieceSize;
                        const pctx = pieceCanvas.getContext('2d');

                        pctx.drawImage(
                            canvas,
                            col * pieceSize, row * pieceSize, pieceSize, pieceSize,
                            0, 0, pieceSize, pieceSize
                        );

                        pecesDataURL.push(pieceCanvas.toDataURL());
                    }
                }

                // Crear ordre aleatori
                ordre = Array.from({ length: total }, (_, i) => i);
                for (let i = total - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [ordre[i], ordre[j]] = [ordre[j], ordre[i]];
                }

                fixat = new Array(total).fill(false);
                renderitzarPuzzle();
            };

            img.src = imagenActual;
        }

        function renderitzarPuzzle() {
            const total = divisions * divisions;
            const pieceSize = 400 / divisions;

            puzzleContainer.innerHTML = '';
            puzzleContainer.style.gridTemplateColumns = `repeat(${divisions}, 1fr)`;

            for (let i = 0; i < total; i++) {
                const pecaIndex = ordre[i];
                const piece = document.createElement('div');
                piece.className = 'puzzle-piece';

                if (fixat[i]) {
                    piece.classList.add('fixed');
                } else {
                    piece.classList.add('unfixed');
                }

                piece.style.backgroundImage = `url('${pecesDataURL[pecaIndex]}')`;
                piece.style.backgroundSize = '100% 100%';
                piece.style.backgroundPosition = 'center';
                piece.dataset.posicio = i;

                if (!fixat[i]) {
                    piece.draggable = true;
                    piece.addEventListener('dragstart', handleDragStart);
                    piece.addEventListener('dragover', handleDragOver);
                    piece.addEventListener('drop', handleDrop);
                    piece.addEventListener('dragend', handleDragEnd);
                }

                puzzleContainer.appendChild(piece);
            }
        }

        let origenIndex = null;

        function handleDragStart(e) {
            origenIndex = parseInt(e.target.dataset.posicio);
            e.dataTransfer.effectAllowed = 'move';
            e.target.style.opacity = '0.5';
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        }

        function handleDrop(e) {
            e.preventDefault();
            const destiPiece = e.target.closest('.puzzle-piece');
            if (!destiPiece || fixat[destiPiece.dataset.posicio]) return;

            const destiIndex = parseInt(destiPiece.dataset.posicio);
            if (origenIndex === null || origenIndex === destiIndex) return;

            [ordre[origenIndex], ordre[destiIndex]] = [ordre[destiIndex], ordre[origenIndex]];

            for (let i = 0; i < ordre.length; i++) {
                fixat[i] = (ordre[i] === i);
            }

            renderitzarPuzzle();

            const totsFixats = fixat.every(v => v === true);
            if (totsFixats) {
                log('🎉 ¡VICTÒRIA!');
                victoryOverlay.classList.add('active');
            } else {
                const correctes = fixat.filter(v => v).length;
                log(`🧩 ${correctes}/${ordre.length} peces`);
            }

            origenIndex = null;
        }

        function handleDragEnd(e) {
            e.target.style.opacity = '1';
        }

        victoryBtn.addEventListener('click', () => {
            victoryOverlay.classList.remove('active');
            carregarImagenAleatoria();
        });

        carregarBtn.addEventListener('click', carregarImagenAleatoria);

        divisionsSelect.addEventListener('change', () => {
            if (imagenActual) iniciarPuzzle();
        });

        carregarImagenAleatoria();
    </script>
</body>
</html>
