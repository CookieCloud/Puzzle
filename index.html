<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Puzzle d'Art Aleatori">
    <meta name="theme-color" content="#2c3e50">
    <title>Puzzle Art</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #667eea;
        }

        .btn-principal {
            display: block;
            width: 100%;
            padding: 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
            transition: background 0.3s;
        }

        .btn-principal:active {
            background: #5568d3;
            transform: scale(0.98);
        }

        .controls {
            text-align: center;
            margin-bottom: 20px;
        }

        .controls select {
            padding: 8px 12px;
            border-radius: 6px;
            border: 2px solid #667eea;
            font-size: 14px;
        }

        .puzzle-grid {
            display: grid;
            gap: 4px;
            margin-bottom: 20px;
            background: #f0f0f0;
            padding: 8px;
            border-radius: 8px;
            min-height: 300px;
        }

        .puzzle-piece {
            background-size: cover;
            background-position: center;
            border-radius: 4px;
            cursor: grab;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            position: relative;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        .puzzle-piece:active {
            cursor: grabbing;
            opacity: 0.8;
            z-index: 100;
        }

        .puzzle-piece.correcta {
            opacity: 0.6;
            filter: brightness(0.9);
        }

        .image-preview {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
        }

        .image-preview img {
            max-width: 100%;
            max-height: 250px;
            border-radius: 6px;
        }

        .missatge {
            text-align: center;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            min-height: 20px;
        }

        .missatge.victòria {
            background: #d4edda;
            color: #155724;
        }

        .missatge.error {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 Puzzle Art Aleatori</h1>
        
        <button id="carregarBtn" class="btn-principal">Carregar Imatge Nova</button>
        
        <div class="controls">
            <label>Divisions: 
                <select id="divisionsSelect">
                    <option value="3">3×3 (9 peces)</option>
                    <option value="4" selected>4×4 (16 peces)</option>
                    <option value="5">5×5 (25 peces)</option>
                </select>
            </label>
        </div>

        <div id="puzzleContainer" class="puzzle-grid"></div>
        <div id="imagePreview" class="image-preview">
            <p>Aquí es mostrarà la imatge original</p>
        </div>

        <div id="missatge" class="missatge"></div>
    </div>

    <script>
        const carregarBtn = document.getElementById('carregarBtn');
        const puzzleContainer = document.getElementById('puzzleContainer');
        const imagePreview = document.getElementById('imagePreview');
        const missatgeDiv = document.getElementById('missatge');
        const divisionsSelect = document.getElementById('divisionsSelect');

        let imagenActual = null;
        let divisions = 4;
        let canvasImg = null;

        async function carregarImagenAleatoria() {
            try {
                missatgeDiv.textContent = 'Carregant imatge...';
                missatgeDiv.className = '';
                
                const timestamp = new Date().getTime();
                const imageUrl = `https://picsum.photos/600/600?random=${timestamp}`;
                
                const img = new Image();
                img.crossOrigin = 'anonymous';
                
                img.onload = () => {
                    imagenActual = imageUrl;
                    canvasImg = img;
                    mostrarImatge();
                    crearPuzzle();
                    missatgeDiv.textContent = '';
                };
                
                img.onerror = () => {
                    missatgeDiv.textContent = 'Error al carregar la imatge. Intenta de nou.';
                    missatgeDiv.className = 'error';
                };
                
                img.src = imageUrl;
                
            } catch (error) {
                console.error('Error:', error);
                missatgeDiv.textContent = 'Error al carregar la imatge.';
                missatgeDiv.className = 'error';
            }
        }

        function mostrarImatge() {
            imagePreview.innerHTML = `<img src="${imagenActual}" alt="Original" style="max-width:100%; border-radius:6px;">`;
        }

        function crearPuzzle() {
            divisions = parseInt(divisionsSelect.value);
            puzzleContainer.innerHTML = '';
            puzzleContainer.style.gridTemplateColumns = `repeat(${divisions}, 1fr)`;
            
            const totalPieces = divisions * divisions;
            const tamanyPeca = 600 / divisions;
            
            const posiciones = Array.from({length: totalPieces}, (_, i) => i);
            
            for (let i = posiciones.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [posiciones[i], posiciones[j]] = [posiciones[j], posiciones[i]];
            }
            
            posiciones.forEach((posicioCorrecta, indexActual) => {
                const piece = document.createElement('div');
                piece.className = 'puzzle-piece';
                piece.draggable = true;
                piece.dataset.posicioCorrecta = posicioCorrecta;
                piece.dataset.posicioActual = indexActual;
                
                const fila = Math.floor(posicioCorrecta / divisions);
                const columna = posicioCorrecta % divisions;
                
                const canvas = document.createElement('canvas');
                canvas.width = tamanyPeca;
                canvas.height = tamanyPeca;
                const ctx = canvas.getContext('2d');
                
                if (canvasImg) {
                    ctx.drawImage(
                        canvasImg,
                        columna * tamanyPeca,
                        fila * tamanyPeca,
                        tamanyPeca,
                        tamanyPeca,
                        0,
                        0,
                        tamanyPeca,
                        tamanyPeca
                    );
                }
                
                piece.style.backgroundImage = `url('${canvas.toDataURL()}')`;
                piece.style.backgroundSize = 'cover';
                piece.style.backgroundPosition = 'center';
                
                piece.addEventListener('dragstart', dragStart);
                piece.addEventListener('dragover', dragOver);
                piece.addEventListener('drop', drop);
                piece.addEventListener('dragend', dragEnd);
                
                puzzleContainer.appendChild(piece);
            });
        }

        let draggedElement = null;

        function dragStart(e) {
            draggedElement = this;
            this.style.opacity = '0.6';
            e.dataTransfer.effectAllowed = 'move';
        }

        function dragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        }

        function drop(e) {
            e.preventDefault();
            
            if (draggedElement && draggedElement !== this) {
                const tempData = draggedElement.dataset.posicioActual;
                draggedElement.dataset.posicioActual = this.dataset.posicioActual;
                this.dataset.posicioActual = tempData;
                
                const allPieces = Array.from(puzzleContainer.children);
                const indexA = allPieces.indexOf(draggedElement);
                const indexB = allPieces.indexOf(this);
                
                if (indexA < indexB) {
                    this.parentNode.insertBefore(draggedElement, this);
                } else {
                    this.parentNode.insertBefore(this, draggedElement);
                }
                
                verificarSolucio();
            }
