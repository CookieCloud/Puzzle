<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzle Art</title>
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f5f5f5;
            --bg-tertiary: #f0f0f0;
            --text-primary: #333333;
            --text-secondary: #666666;
            --border-color: #e0e0e0;
            --btn-bg: #667eea;
            --btn-hover: #5568d3;
            --gradient-1: #667eea;
            --gradient-2: #764ba2;
            --shadow: rgba(0, 0, 0, 0.2);
        }

        body.dark-mode {
            --bg-primary: #1e1e1e;
            --bg-secondary: #2d2d2d;
            --bg-tertiary: #3a3a3a;
            --text-primary: #e0e0e0;
            --text-secondary: #b0b0b0;
            --border-color: #444444;
            --btn-bg: #7c7cff;
            --btn-hover: #6b6bdd;
            --gradient-1: #5a5a8a;
            --gradient-2: #3a3a5a;
            --shadow: rgba(0, 0, 0, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--gradient-1) 0%, var(--gradient-2) 100%);
            min-height: 100vh;
            padding: 20px;
            color: var(--text-primary);
            transition: background 0.3s;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: var(--bg-primary);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 40px var(--shadow);
            transition: background 0.3s;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--btn-bg);
            font-size: 1.8rem;
        }

        .theme-toggle {
            background: var(--bg-secondary);
            border: none;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            cursor: pointer;
            font-size: 20px;
            transition: background 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .theme-toggle:active {
            background: var(--bg-tertiary);
        }

        button:not(.theme-toggle) {
            display: block;
            width: 100%;
            padding: 12px;
            background: var(--btn-bg);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 12px;
            transition: background 0.2s;
        }

        button:not(.theme-toggle):active {
            background: var(--btn-hover);
            transform: scale(0.98);
        }

        .input-group {
            margin-bottom: 12px;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .file-input-wrapper {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .file-input-wrapper input[type="file"] {
            position: absolute;
            opacity: 0;
            cursor: pointer;
        }

        .file-input-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            color: var(--text-primary);
            transition: all 0.2s;
        }

        .file-input-wrapper:hover .file-input-label {
            border-color: var(--btn-bg);
            background: var(--bg-tertiary);
        }

        .url-input-wrapper {
            flex: 1;
            display: flex;
            gap: 8px;
        }

        input[type="text"], input[type="password"] {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 2px solid var(--border-color);
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 13px;
        }

        input[type="text"]:focus, input[type="password"]:focus {
            outline: none;
            border-color: var(--btn-bg);
        }

        .url-btn, .flickr-btn {
            padding: 12px 16px !important;
            width: auto !important;
            margin-bottom: 0 !important;
            background: var(--btn-bg);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: background 0.2s;
        }

        .url-btn:active, .flickr-btn:active {
            background: var(--btn-hover);
            transform: scale(0.95);
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .control-group label {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        select {
            padding: 10px;
            border-radius: 6px;
            border: 2px solid var(--border-color);
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 14px;
        }

        select:focus {
            outline: none;
            border-color: var(--btn-bg);
        }

        .puzzle-grid {
            display: grid;
            gap: 0;
            margin-bottom: 20px;
            background: var(--bg-tertiary);
            padding: 4px;
            border-radius: 8px;
            aspect-ratio: 1 / 1;
            width: 100%;
        }

        .puzzle-piece {
            background-size: cover;
            background-position: center;
            cursor: grab;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            position: relative;
        }

        .puzzle-piece.unfixed {
            margin: 4px;
            box-shadow: 0 2px 8px var(--shadow);
            border-radius: 2px;
        }

        .puzzle-piece.fixed {
            margin: 0;
            box-shadow: none;
            cursor: default;
            border-radius: 0;
        }

        .puzzle-piece:active:not(.fixed) {
            cursor: grabbing;
            opacity: 0.8;
            z-index: 100;
        }

        .image-preview {
            background: var(--bg-secondary);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-preview img {
            max-width: 100%;
            max-height: 250px;
            border-radius: 6px;
        }

        .log {
            background: var(--bg-tertiary);
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            color: var(--text-secondary);
            min-height: 1.5em;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            backdrop-filter: blur(4px);
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-primary);
            padding: 30px;
            border-radius: 16px;
            max-width: 400px;
            box-shadow: 0 20px 60px var(--shadow);
            animation: popIn 0.3s ease-out;
        }

        .modal-content h2 {
            color: var(--btn-bg);
            margin-bottom: 15px;
            font-size: 1.5rem;
        }

        .modal-content p {
            color: var(--text-secondary);
            font-size: 13px;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .modal-input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 14px;
        }

        .modal-input:focus {
            outline: none;
            border-color: var(--btn-bg);
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .modal-btn.save {
            background: var(--btn-bg);
            color: white;
        }

        .modal-btn.save:active {
            background: var(--btn-hover);
        }

        .modal-btn.cancel {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .modal-btn.cancel:active {
            background: var(--border-color);
        }

        .victory-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }

        .victory-overlay.active {
            display: flex;
        }

        .victory-popup {
            background: var(--bg-primary);
            padding: 40px 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            animation: popIn 0.4s ease-out;
            max-width: 95%;
        }

        .victory-popup h2 {
            font-size: 2.5rem;
            color: var(--btn-bg);
            margin-bottom: 10px;
        }

        .victory-popup p {
            font-size: 1.1rem;
            color: var(--text-primary);
            margin-bottom: 20px;
        }

        .victory-popup .final-puzzle {
            margin: 20px 0;
            border-radius: 12px;
            max-width: 100%;
            width: 450px;
            max-height: 450px;
            box-shadow: 0 4px 15px var(--shadow);
        }

        .victory-popup button {
            display: inline-block;
            width: auto;
            padding: 12px 40px;
            background: var(--btn-bg);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 15px;
        }

        .victory-popup button:active {
            background: var(--btn-hover);
            transform: scale(0.98);
        }

        @keyframes popIn {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @media (max-width: 500px) {
            .container {
                padding: 15px;
            }
            h1 {
                font-size: 1.5rem;
            }
            .victory-popup .final-puzzle {
                width: 300px;
                max-height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧩 Puzzle Art</h1>
            <button class="theme-toggle" id="themeToggle" title="Canviar mode fosc">🌙</button>
        </div>

        <!-- FLICKR -->
        <button id="flickrBtn">🖼️ Carregar de Flickr</button>

        <!-- FITXER LOCAL -->
        <div class="input-group">
            <div class="file-input-wrapper">
                <input type="file" id="fileUpload" accept="image/*">
                <label class="file-input-label">📁 Puja Fitxer</label>
            </div>
        </div>

        <!-- URL CUSTOM -->
        <div class="input-group">
            <div class="url-input-wrapper">
                <input type="text" id="customUrl" placeholder="Enganxa URL de foto...">
                <button class="url-btn" id="loadCustomBtn">🔗</button>
            </div>
        </div>

        <!-- BOTÓ NOVA IMATGE -->
        <button id="carregarBtn">Carregar Imatge Aleatòria</button>

        <!-- DIVISIONS -->
        <div class="controls">
            <div class="control-group">
                <label for="divisionsSelect">Divisions:</label>
                <select id="divisionsSelect">
                    <option value="2">2×2 (4 peces)</option>
                    <option value="3">3×3 (9 peces)</option>
                    <option value="4" selected>4×4 (16 peces)</option>
                    <option value="5">5×5 (25 peces)</option>
                </select>
            </div>
        </div>

        <!-- PUZZLE -->
        <div id="puzzleContainer" class="puzzle-grid"></div>

        <!-- PREVIEW -->
        <div id="imagePreview" class="image-preview">
            <img id="previewImg" src="" alt="Original">
        </div>

        <!-- LOG -->
        <div class="log" id="log">Carregant...</div>
    </div>

    <!-- FLICKR CONFIG MODAL -->
    <div id="flickrModal" class="modal">
        <div class="modal-content">
            <h2>🖼️ Flickr</h2>
            <p>Enganxa les teves credencials de Flickr. Es guardaran només al teu dispositiu.</p>
            <input type="text" class="modal-input" id="apiKeyInput" placeholder="API Key">
            <input type="text" class="modal-input" id="userIdInput" placeholder="User ID">
            <div class="modal-buttons">
                <button class="modal-btn cancel" id="cancelFlickrBtn">Cancelar</button>
                <button class="modal-btn save" id="saveFlickrBtn">Guardar</button>
            </div>
        </div>
    </div>

    <!-- VICTORY POPUP -->
    <div id="victoryOverlay" class="victory-overlay">
        <div class="victory-popup">
            <h2>🎉 ¡VICTÒRIA!</h2>
            <p>Has completat el puzzle!</p>
            <img id="finalImage" class="final-puzzle" src="" alt="Puzzle completat">
            <br>
            <button id="victoryBtn">Jugar de Nou</button>
        </div>
    </div>

    <script>
        const carregarBtn = document.getElementById('carregarBtn');
        const flickrBtn = document.getElementById('flickrBtn');
        const puzzleContainer = document.getElementById('puzzleContainer');
        const previewImg = document.getElementById('previewImg');
        const divisionsSelect = document.getElementById('divisionsSelect');
        const logDiv = document.getElementById('log');
        const victoryOverlay = document.getElementById('victoryOverlay');
        const victoryBtn = document.getElementById('victoryBtn');
        const finalImage = document.getElementById('finalImage');
        const themeToggle = document.getElementById('themeToggle');
        const fileUpload = document.getElementById('fileUpload');
        const customUrl = document.getElementById('customUrl');
        const loadCustomBtn = document.getElementById('loadCustomBtn');
        const flickrModal = document.getElementById('flickrModal');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const userIdInput = document.getElementById('userIdInput');
        const saveFlickrBtn = document.getElementById('saveFlickrBtn');
        const cancelFlickrBtn = document.getElementById('cancelFlickrBtn');

        let imagenActual = null;
        let divisions = 4;
        let ordre = [];
        let fixat = [];
        let pecesDataURL = [];
        let sourceMode = 'random';

        // THEME TOGGLE
        function initTheme() {
            const isDark = localStorage.getItem('darkMode') === 'true';
            if (isDark) {
                document.body.classList.add('dark-mode');
                themeToggle.textContent = '☀️';
            }
        }

        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('darkMode', isDark);
            themeToggle.textContent = isDark ? '☀️' : '🌙';
        });

        // FLICKR MODAL
        flickrBtn.addEventListener('click', () => {
            const savedApiKey = localStorage.getItem('flickrApiKey');
            const savedUserId = localStorage.getItem('flickrUserId');
            
            if (savedApiKey && savedUserId) {
                carregarFlickr();
            } else {
                flickrModal.classList.add('active');
            }
        });

        saveFlickrBtn.addEventListener('click', () => {
            const apiKey = apiKeyInput.value.trim();
            const userId = userIdInput.value.trim();

            if (!apiKey || !userId) {
                log('❌ Omple tots els camps');
                return;
            }

            localStorage.setItem('flickrApiKey', apiKey);
            localStorage.setItem('flickrUserId', userId);
            apiKeyInput.value = '';
            userIdInput.value = '';
            flickrModal.classList.remove('active');
            
            log('🔄 Carregant fotos de Flickr...');
            carregarFlickr();
        });

        cancelFlickrBtn.addEventListener('click', () => {
            apiKeyInput.value = '';
            userIdInput.value = '';
            flickrModal.classList.remove('active');
        });

        function carregarFlickr() {
            const apiKey = localStorage.getItem('flickrApiKey');
            const userId = localStorage.getItem('flickrUserId');

            if (!apiKey || !userId) {
                log('❌ Configura Flickr primer');
                return;
            }

            log('🔄 Carregant fotos de Flickr...');

            const url = `https://www.flickr.com/services/rest/?method=flickr.people.getPublicPhotos&user_id=${userId}&api_key=${apiKey}&format=json&nojsoncallback=1&per_page=30`;

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    if (data.stat === 'fail') {
                        log('❌ Error: ' + data.message);
                        return;
                    }

                    if (!data.photos || data.photos.photo.length === 0) {
                        log('❌ No hi ha fotos públiques');
                        return;
                    }

                    const fotos = data.photos.photo;
                    const fotoAleatoria = fotos[Math.floor(Math.random() * fotos.length)];
                    
                    // Construir URL: https://live.staticflickr.com/{server-id}/{id}_{secret}_b.jpg
                    const imageUrl = `https://live.staticflickr.com/${fotoAleatoria.server}/${fotoAleatoria.id}_${fotoAleatoria.secret}_b.jpg`;

                    const img = new Image();
                    img.crossOrigin = 'anonymous';
                    img.onload = () => {
                        imagenActual = imageUrl;
                        previewImg.src = imageUrl;
                        finalImage.src = imageUrl;
                        sourceMode = 'flickr';
                        iniciarPuzzle();
                        log('✅ Foto de Flickr carregada');
                    };
                    img.onerror = () => {
                        log('❌ Error al carregar la foto');
                    };
                    img.src = imageUrl;
                })
                .catch(error => {
                    log('❌ Error de conexió: ' + error.message);
                });
        }

        // FILE UPLOAD
        fileUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    imagenActual = event.target.result;
                    previewImg.src = imagenActual;
                    finalImage.src = imagenActual;
                    sourceMode = 'file';
                    iniciarPuzzle();
                    log('✅ Foto pujada');
                };
                reader.readAsDataURL(file);
            }
        });

        // CUSTOM URL
        loadCustomBtn.addEventListener('click', () => {
            const url = customUrl.value.trim();
            if (!url) {
                log('❌ Enganxa una URL vàlida');
                return;
            }
            
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = () => {
                imagenActual = url;
                previewImg.src = url;
                finalImage.src = url;
                sourceMode = 'url';
                iniciarPuzzle();
                log('✅ URL carregada');
            };
            img.onerror = () => {
                log('❌ Error. Verifica que la URL sigui vàlida');
            };
            img.src = url;
        });

        function log(msg) {
            console.log(msg);
            logDiv.textContent = msg;
        }

        function carregarImagenAleatoria() {
            log('🔄 Carregant imatge...');
            
            const seed = Math.floor(Math.random() * 1000000);
            const imageUrl = `https://source.unsplash.com/400x400/?nature,landscape&sig=${seed}`;

            const img = new Image();
            img.crossOrigin = 'anonymous';

            img.onload = () => {
                imagenActual = imageUrl;
                previewImg.src = imageUrl;
                finalImage.src = imageUrl;
                sourceMode = 'random';
                iniciarPuzzle();
                log('✅ Imatge carregada');
            };

            img.onerror = () => {
                log('❌ Reintentan...');
                // Reintentar una vegada
                setTimeout(() => carregarImagenAleatoria(), 1000);
            };

            img.src = imageUrl;
        }
        function iniciarPuzzle() {
            if (!imagenActual) {
                log('⚠️ Carrega una imatge primer');
                return;
            }

            divisions = parseInt(divisionsSelect.value);
            const total = divisions * divisions;
            
            log(`📦 Creant puzzle ${divisions}×${divisions}...`);

            const canvas = document.createElement('canvas');
            canvas.width = 400;
            canvas.height = 400;
            const ctx = canvas.getContext('2d');

            const img = new Image();
            img.crossOrigin = 'anonymous';

            img.onload = function() {
                ctx.drawImage(img, 0, 0, 400, 400);
                
                pecesDataURL = [];
                const pieceSize = 400 / divisions;

                for (let row = 0; row < divisions; row++) {
                    for (let col = 0; col < divisions; col++) {
                        const pieceCanvas = document.createElement('canvas');
                        pieceCanvas.width = pieceSize;
                        pieceCanvas.height = pieceSize;
                        const pctx = pieceCanvas.getContext('2d');

                        pctx.drawImage(
                            canvas,
                            col * pieceSize, row * pieceSize, pieceSize, pieceSize,
                            0, 0, pieceSize, pieceSize
                        );

                        pecesDataURL.push(pieceCanvas.toDataURL());
                    }
                }

                ordre = Array.from({ length: total }, (_, i) => i);
                for (let i = total - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [ordre[i], ordre[j]] = [ordre[j], ordre[i]];
                }

                fixat = new Array(total).fill(false);
                renderitzarPuzzle();
                log('🧩 Arrossega les peces!');
            };

            img.onerror = () => {
                log('❌ Error procesant la imatge');
            };

            img.src = imagenActual;
        }

        function renderitzarPuzzle() {
            const total = divisions * divisions;

            puzzleContainer.innerHTML = '';
            puzzleContainer.style.gridTemplateColumns = `repeat(${divisions}, 1fr)`;

            for (let i = 0; i < total; i++) {
                const pecaIndex = ordre[i];
                const piece = document.createElement('div');
                piece.className = 'puzzle-piece';

                if (fixat[i]) {
                    piece.classList.add('fixed');
                } else {
                    piece.classList.add('unfixed');
                }

                piece.style.backgroundImage = `url('${pecesDataURL[pecaIndex]}')`;
                piece.style.backgroundSize = '100% 100%';
                piece.style.backgroundPosition = 'center';
                piece.dataset.posicio = i;

                if (!fixat[i]) {
                    piece.draggable = true;
                    piece.addEventListener('dragstart', handleDragStart);
                    piece.addEventListener('dragover', handleDragOver);
                    piece.addEventListener('drop', handleDrop);
                    piece.addEventListener('dragend', handleDragEnd);
                }

                puzzleContainer.appendChild(piece);
            }
        }

        let origenIndex = null;

        function handleDragStart(e) {
            origenIndex = parseInt(e.target.dataset.posicio);
            e.dataTransfer.effectAllowed = 'move';
            e.target.style.opacity = '0.5';
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        }

        function handleDrop(e) {
            e.preventDefault();
            const destiPiece = e.target.closest('.puzzle-piece');
            if (!destiPiece || fixat[destiPiece.dataset.posicio]) return;

            const destiIndex = parseInt(destiPiece.dataset.posicio);
            if (origenIndex === null || origenIndex === destiIndex) return;

            [ordre[origenIndex], ordre[destiIndex]] = [ordre[destiIndex], ordre[origenIndex]];

            for (let i = 0; i < ordre.length; i++) {
                fixat[i] = (ordre[i] === i);
            }

            renderitzarPuzzle();

            const totsFixats = fixat.every(v => v === true);
            if (totsFixats) {
                log('🎉 ¡VICTÒRIA!');
                victoryOverlay.classList.add('active');
            } else {
                const correctes = fixat.filter(v => v).length;
                log(`🧩 ${correctes}/${ordre.length} peces correctes`);
            }

            origenIndex = null;
        }

        function handleDragEnd(e) {
            e.target.style.opacity = '1';
        }

        victoryBtn.addEventListener('click', () => {
            victoryOverlay.classList.remove('active');
            carregarImagenAleatoria();
        });

        carregarBtn.addEventListener('click', carregarImagenAleatoria);

        divisionsSelect.addEventListener('change', () => {
            if (imagenActual) iniciarPuzzle();
        });

        initTheme();
        carregarImagenAleatoria();
    </script>
</body>
</html>
