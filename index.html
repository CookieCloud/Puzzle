<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzle Art</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #667eea;
        }

        button {
            display: block;
            width: 100%;
            padding: 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
        }

        button:active {
            background: #5568d3;
        }

        .controls {
            text-align: center;
            margin-bottom: 20px;
        }

        select {
            padding: 8px 12px;
            border-radius: 6px;
            border: 2px solid #667eea;
            font-size: 14px;
        }

        .puzzle-grid {
            display: grid;
            gap: 4px;
            margin-bottom: 20px;
            background: #f0f0f0;
            padding: 8px;
            border-radius: 8px;
            min-height: 300px;
        }

        .puzzle-piece {
            background-size: cover;
            background-position: center;
            border-radius: 4px;
            cursor: grab;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            user-select: none;
            -webkit-user-select: none;
        }

        .puzzle-piece:active {
            cursor: grabbing;
            opacity: 0.8;
            z-index: 100;
        }

        .image-preview {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
        }

        .image-preview img {
            max-width: 100%;
            max-height: 250px;
            border-radius: 6px;
        }

        .log {
            background: #f0f0f0;
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            margin-top: 10px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 Puzzle Art</h1>
        
        <button id="carregarBtn">Carregar Imatge Nova</button>
        
        <div class="controls">
            <label>Divisions: 
                <select id="divisionsSelect">
                    <option value="2">2×2 (4 peces)</option>
                    <option value="3">3×3 (9 peces)</option>
                    <option value="4" selected>4×4 (16 peces)</option>
                </select>
            </label>
        </div>

        <div id="puzzleContainer" class="puzzle-grid"></div>
        <div id="imagePreview" class="image-preview"><p>Aquí es mostrarà la imatge original</p></div>
        <div class="log" id="log">Esperant acció...</div>
    </div>

    <script>
        const carregarBtn = document.getElementById('carregarBtn');
        const puzzleContainer = document.getElementById('puzzleContainer');
        const imagePreview = document.getElementById('imagePreview');
        const divisionsSelect = document.getElementById('divisionsSelect');
        const logDiv = document.getElementById('log');

        let imagenActual = null;
        let divisions = 4;

        function log(msg) {
            console.log(msg);
            logDiv.textContent = msg;
        }

        function carregarImagenAleatoria() {
            log('🔄 Carregant imatge...');
            
            const timestamp = Date.now();
            const imageUrl = `https://picsum.photos/400/400?random=${timestamp}`;
            
            const img = new Image();
            img.crossOrigin = 'anonymous';
            
            img.onload = () => {
                log('✅ Imatge carregada');
                imagenActual = imageUrl;
                mostrarImatge();
                crearPuzzle();
            };
            
            img.onerror = () => {
                log('❌ Error al carregar la imatge');
            };
            
            img.src = imageUrl;
        }

        function mostrarImatge() {
            imagePreview.innerHTML = `<img src="${imagenActual}" alt="Original">`;
        }

        function crearPuzzle() {
            divisions = parseInt(divisionsSelect.value);
            log(`📦 Creant puzzle ${divisions}×${divisions}...`);
            
            puzzleContainer.innerHTML = '';
            puzzleContainer.style.gridTemplateColumns = `repeat(${divisions}, 1fr)`;
            
            const totalPieces = divisions * divisions;
            const tamanyPeca = 400 / divisions;
            
            // Crear array aleatori
            const orden = Array.from({length: totalPieces}, (_, i) => i);
            for (let i = totalPieces - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [orden[i], orden[j]] = [orden[j], orden[i]];
            }
            
            // Crear peces
            orden.forEach((posicioCorrecta, indexActual) => {
                const piece = document.createElement('div');
                piece.className = 'puzzle-piece';
                piece.draggable = true;
                piece.dataset.correct = posicioCorrecta;
                piece.dataset.actual = indexActual;
                
                const fila = Math.floor(posicioCorrecta / divisions);
                const columna = posicioCorrecta % divisions;
                const offsetX = columna * tamanyPeca;
                const offsetY = fila * tamanyPeca;
                
                piece.style.backgroundImage = `url('${imagenActual}')`;
                piece.style.backgroundPosition = `-${offsetX}px -${offsetY}px`;
                piece.style.backgroundSize = `${divisions * tamanyPeca}px ${divisions * tamanyPeca}px`;
                piece.style.width = `${tamanyPeca}px`;
                piece.style.height = `${tamanyPeca}px`;
                
                piece.addEventListener('dragstart', (e) => {
                    e.dataTransfer.effectAllowed = 'move';
                    e.target.dataset.dragging = 'true';
                });
                
                piece.addEventListener('dragover', (e) => {
                    e.preventDefault();
                });
                
                piece.addEventListener('drop', (e) => {
                    e.preventDefault();
                    const dragging = document.querySelector('[data-dragging="true"]');
                    if (dragging && dragging !== piece) {
                        const tempActual = dragging.dataset.actual;
                        dragging.dataset.actual = piece.dataset.actual;
                        piece.dataset.actual = tempActual;
                        
                        const allPieces = Array.from(puzzleContainer.children);
                        const idxA = allPieces.indexOf(dragging);
                        const idxB = allPieces.indexOf(piece);
                        
                        if (idxA < idxB) {
                            piece.parentNode.insertBefore(dragging, piece);
                        } else {
                            piece.parentNode.insertBefore(piece, dragging);
                        }
                        
                        verificarSolucio();
                    }
                });
                
                piece.addEventListener('dragend', (e) => {
                    piece.dataset.dragging = 'false';
                });
                
                puzzleContainer.appendChild(piece);
            });
            
            log(`✅ ${totalPieces} peces creades`);
        }

        function verificarSolucio() {
            const pieces = Array.from(puzzleContainer.children);
            const totsCorrects = pieces.every((p, idx) => 
                parseInt(p.dataset.actual) === idx
            );
            
            if (totsCorrects) {
                log('🎉 ¡VICTÒRIA! Puzzle completat!');
            }
        }

        carregarBtn.addEventListener('click', carregarImagenAleatoria);
        divisionsSelect.addEventListener('change', () => {
            if (imagenActual) crearPuzzle();
        });

        carregarImagenAleatoria();
    </script>
</body>
</html>
