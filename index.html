<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzle Art</title>
    <style>
        /* Estils sense canvis respecte al teu original */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 { text-align: center; margin-bottom: 20px; color: #667eea; }
        button {
            display: block;
            width: 100%;
            padding: 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
        }
        button:active { background: #5568d3; }
        .controls {
            text-align: center;
            margin-bottom: 20px;
        }
        select {
            padding: 8px 12px;
            border-radius: 6px;
            border: 2px solid #667eea;
            font-size: 14px;
        }
        .puzzle-grid {
            display: grid;
            gap: 4px;
            margin-bottom: 20px;
            background: #f0f0f0;
            padding: 8px;
            border-radius: 8px;
            min-height: 300px;
        }
        .puzzle-piece {
            background-size: cover;
            background-position: center;
            border-radius: 4px;
            cursor: grab;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            user-select: none;
            -webkit-user-select: none;
        }
        .puzzle-piece:active {
            cursor: grabbing;
            opacity: 0.8;
            z-index: 100;
        }
        .image-preview {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .image-preview img {
            max-width: 100%;
            max-height: 250px;
            border-radius: 6px;
        }
        .image-preview .placeholder {
            color: #999;
            font-style: italic;
        }
        .log {
            background: #f0f0f0;
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            margin-top: 10px;
            color: #666;
            min-height: 1.5em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 Puzzle Art</h1>
        <button id="carregarBtn">Carregar Imatge Nova</button>
        <div class="controls">
            <label>Divisions: 
                <select id="divisionsSelect">
                    <option value="2">2×2 (4 peces)</option>
                    <option value="3">3×3 (9 peces)</option>
                    <option value="4" selected>4×4 (16 peces)</option>
                </select>
            </label>
        </div>
        <div id="puzzleContainer" class="puzzle-grid"></div>
        <div id="imagePreview" class="image-preview">
            <span class="placeholder">Carregant imatge...</span>
        </div>
        <div class="log" id="log">Esperant acció...</div>
    </div>

    <script>
        const carregarBtn = document.getElementById('carregarBtn');
        const puzzleContainer = document.getElementById('puzzleContainer');
        const imagePreview = document.getElementById('imagePreview');
        const divisionsSelect = document.getElementById('divisionsSelect');
        const logDiv = document.getElementById('log');

        let imagenActual = null;
        let divisions = 4;

        function log(msg) {
            console.log(msg);
            logDiv.textContent = msg;
        }

        // Genera imatge de reserva (gradient + emoji) per si falla la càrrega
        function generarImatgeReserva() {
            const canvas = document.createElement('canvas');
            canvas.width = 400;
            canvas.height = 400;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createLinearGradient(0, 0, 400, 400);
            gradient.addColorStop(0, '#ff6b6b');
            gradient.addColorStop(0.5, '#feca57');
            gradient.addColorStop(1, '#48dbfb');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 400, 400);
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.beginPath();
            ctx.arc(200, 200, 120, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.font = 'bold 40px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🎨', 200, 200);
            return canvas.toDataURL('image/png');
        }

        function carregarImagenAleatoria() {
            log('🔄 Carregant imatge...');
            imagePreview.innerHTML = '<span class="placeholder">Carregant...</span>';

            const seed = Math.floor(Math.random() * 100000);
            const imageUrl = `https://picsum.photos/seed/${seed}/400/400`;

            const img = new Image();
            img.crossOrigin = 'anonymous';

            let carregada = false;

            img.onload = () => {
                carregada = true;
                log('✅ Imatge carregada correctament');
                imagenActual = imageUrl;
                mostrarImatge();
                crearPuzzle();
            };

            img.onerror = () => {
                log('❌ Error en carregar la imatge externa. S\'utilitzarà una de reserva.');
                imagenActual = generarImatgeReserva();
                mostrarImatge();
                crearPuzzle();
            };

            // Timeout per si la càrrega es bloqueja
            const timeout = setTimeout(() => {
                if (!carregada) {
                    log('⏱️ Temps d\'espera excedit. Usant imatge de reserva.');
                    img.src = '';
                    imagenActual = generarImatgeReserva();
                    mostrarImatge();
                    crearPuzzle();
                }
            }, 10000);

            // Netejar timeout quan la imatge es carregui o falli
            const cleanTimeout = () => clearTimeout(timeout);
            img.addEventListener('load', cleanTimeout);
            img.addEventListener('error', cleanTimeout);

            img.src = imageUrl;
        }

        function mostrarImatge() {
            if (imagenActual) {
                imagePreview.innerHTML = `<img src="${imagenActual}" alt="Imatge original">`;
            } else {
                imagePreview.innerHTML = '<span class="placeholder">No hi ha imatge</span>';
            }
        }

        // Intercanvia dos nodes al DOM
        function swapNodes(nodeA, nodeB) {
            const parent = nodeA.parentNode;
            // Crear un element temporal per facilitar l'intercanvi
            const temp = document.createElement('span');
            parent.replaceChild(temp, nodeA);
            parent.replaceChild(nodeA, nodeB);
            parent.replaceChild(nodeB, temp);
        }

        function crearPuzzle() {
            if (!imagenActual) {
                log('⚠️ No hi ha imatge per crear el puzzle.');
                return;
            }

            divisions = parseInt(divisionsSelect.value);
            log(`📦 Creant puzzle ${divisions}×${divisions}...`);

            puzzleContainer.innerHTML = '';
            puzzleContainer.style.gridTemplateColumns = `repeat(${divisions}, 1fr)`;

            const totalPieces = divisions * divisions;
            const tamanyPeca = 400 / divisions;

            // Crear array aleatori (barrejar les posicions)
            const orden = Array.from({ length: totalPieces }, (_, i) => i);
            for (let i = totalPieces - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [orden[i], orden[j]] = [orden[j], orden[i]];
            }

            // Crear peces en l'ordre barrejat
            orden.forEach((posicioCorrecta) => {
                const piece = document.createElement('div');
                piece.className = 'puzzle-piece';
                piece.draggable = true;
                // Emmagatzemar la posició que li correspon (0..N-1)
                piece.dataset.correct = posicioCorrecta;

                const fila = Math.floor(posicioCorrecta / divisions);
                const columna = posicioCorrecta % divisions;
                const offsetX = columna * tamanyPeca;
                const offsetY = fila * tamanyPeca;

                piece.style.backgroundImage = `url('${imagenActual}')`;
                piece.style.backgroundPosition = `-${offsetX}px -${offsetY}px`;
                piece.style.backgroundSize = `${divisions * tamanyPeca}px ${divisions * tamanyPeca}px`;
                piece.style.width = `${tamanyPeca}px`;
                piece.style.height = `${tamanyPeca}px`;

                // Esdeveniments d'arrossegament
                piece.addEventListener('dragstart', (e) => {
                    e.dataTransfer.effectAllowed = 'move';
                    e.target.dataset.dragging = 'true';
                });

                piece.addEventListener('dragover', (e) => {
                    e.preventDefault(); // necessari per permetre drop
                });

                piece.addEventListener('drop', (e) => {
                    e.preventDefault();
                    const dragging = document.querySelector('[data-dragging="true"]');
                    if (dragging && dragging !== piece) {
                        // Intercanviar els nodes al DOM
                        swapNodes(dragging, piece);
                        // Verificar si el puzzle està resolt
                        verificarSolucio();
                    }
                });

                piece.addEventListener('dragend', (e) => {
                    piece.dataset.dragging = 'false';
                });

                puzzleContainer.appendChild(piece);
            });

            log(`✅ ${totalPieces} peces creades`);
        }

        function verificarSolucio() {
            const pieces = Array.from(puzzleContainer.children);
            const totsCorrects = pieces.every((p, idx) => {
                const correct = parseInt(p.dataset.correct);
                return correct === idx;
            });

            if (totsCorrects) {
                log('🎉 ¡VICTÒRIA! Puzzle completat!');
            } else {
                log('🧩 Segueix intentant-ho...');
            }
        }

        // Esdeveniments
        carregarBtn.addEventListener('click', carregarImagenAleatoria);
        divisionsSelect.addEventListener('change', () => {
            if (imagenActual) crearPuzzle();
        });

        // Iniciar
        carregarImagenAleatoria();
    </script>
</body>
</html>
