<!DOCTYPE html>
<!--
    PUZZLE ART PWA
    Version: 2.22
    
    FIX: imagePreview (ajuda) roman sempre fixa
    Només s'amaga quan l'usuari activa mode 🚀
-->
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/png" sizes="32x32" href="puzzle32x32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="puzzle192x192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="puzzle180x180.png">
    <title>Puzzle Art</title>
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f5f5f5;
            --bg-tertiary: #f0f0f0;
            --text-primary: #333333;
            --text-secondary: #666666;
            --border-color: #e0e0e0;
            --btn-bg: #667eea;
            --btn-hover: #5568d3;
            --gradient-1: #667eea;
            --gradient-2: #764ba2;
            --shadow: rgba(0, 0, 0, 0.2);
        }
        body.dark-mode {
            --bg-primary: #1e1e1e;
            --bg-secondary: #2d2d2d;
            --bg-tertiary: #3a3a3a;
            --text-primary: #e0e0e0;
            --text-secondary: #b0b0b0;
            --border-color: #444444;
            --btn-bg: #7c7cff;
            --btn-hover: #6b6bdd;
            --gradient-1: #5a5a8a;
            --gradient-2: #3a3a5a;
            --shadow: rgba(0, 0, 0, 0.5);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--gradient-1) 0%, var(--gradient-2) 100%);
            min-height: 100vh;
            min-height: 100dvh;
            padding: max(120px, env(safe-area-inset-top)) 10px 10px 10px;
            color: var(--text-primary);
            transition: background 0.3s;
            -webkit-user-select: none;
            user-select: none;
        }
        .container {
            max-width: 600px;
            margin: 50px auto 0 auto;
            background: var(--bg-primary);
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 10px 40px var(--shadow);
            transition: background 0.3s;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 50px;
            gap: 8px;
        }
        h1 {
            color: var(--btn-bg);
            font-size: clamp(1.2rem, 5vw, 1.8rem);
            flex: 1;
        }
        h1 #version {
            font-size: 0.6em;
            opacity: 0.7;
            margin-left: 8px;
        }
        .header-buttons {
            display: flex;
            gap: 6px;
        }
        .theme-toggle, .difficulty-toggle {
            background: var(--bg-secondary);
            border: none;
            border-radius: 50%;
            width: clamp(36px, 10vw, 44px);
            height: clamp(36px, 10vw, 44px);
            cursor: pointer;
            font-size: clamp(16px, 4vw, 18px);
            transition: background 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            touch-action: manipulation;
        }
        .theme-toggle:active, .difficulty-toggle:active {
            background: var(--bg-tertiary);
        }
        .controls-bar {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        select {
            padding: clamp(6px, 2vw, 8px) clamp(6px, 2vw, 10px);
            border-radius: 6px;
            border: 2px solid var(--border-color);
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: clamp(11px, 2.5vw, 12px);
            flex-shrink: 0;
            touch-action: manipulation;
        }
        select:focus {
            outline: none;
            border-color: var(--btn-bg);
        }
        .icon-btn {
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            border-radius: 6px;
            width: clamp(36px, 10vw, 40px);
            height: clamp(36px, 10vw, 40px);
            cursor: pointer;
            font-size: clamp(16px, 4vw, 18px);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
            color: var(--text-primary);
            touch-action: manipulation;
        }
        .icon-btn:active {
            background: var(--btn-bg);
            color: white;
            border-color: var(--btn-bg);
            transform: scale(0.95);
        }
        .puzzle-grid {
            display: grid;
            gap: 0;
            margin-bottom: 12px;
            background: var(--bg-tertiary);
            padding: 2px;
            border-radius: 8px;
            aspect-ratio: 1 / 1;
            width: 100%;
            touch-action: none;
        }
        .puzzle-piece {
            background-size: cover;
            background-position: center;
            cursor: grab;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            position: relative;
        }
        .puzzle-piece.unfixed {
            margin: 2px;
            box-shadow: 0 2px 8px var(--shadow);
            border-radius: 2px;
        }
        .puzzle-piece.fixed {
            margin: 0;
            box-shadow: none;
            cursor: default;
            border-radius: 0;
        }
        .puzzle-piece:active:not(.fixed) {
            cursor: grabbing;
            opacity: 0.8;
            z-index: 100;
        }
        .image-preview {
            background: var(--bg-secondary);
            padding: clamp(10px, 2vw, 15px);
            border-radius: 8px;
            text-align: center;
            margin-bottom: 12px;
            min-height: clamp(100px, 30vw, 150px);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        .image-preview.hidden {
            display: none;
        }
        .image-preview img {
            max-width: 100%;
            max-height: 100%;
            border-radius: 6px;
        }
        .log {
            background: var(--bg-tertiary);
            padding: clamp(8px, 2vw, 10px);
            border-radius: 6px;
            font-size: clamp(11px, 2.5vw, 12px);
            color: var(--text-secondary);
            min-height: 1.5em;
            word-wrap: break-word;
        }
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            backdrop-filter: blur(4px);
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: var(--bg-primary);
            padding: clamp(20px, 5vw, 30px);
            border-radius: 16px;
            max-width: 90%;
            width: clamp(280px, 90vw, 400px);
            box-shadow: 0 20px 60px var(--shadow);
            animation: popIn 0.3s ease-out;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-content h2 {
            color: var(--btn-bg);
            margin-bottom: 12px;
            font-size: clamp(1.3rem, 4vw, 1.5rem);
        }
        .modal-content p {
            color: var(--text-secondary);
            font-size: clamp(12px, 2.5vw, 13px);
            margin-bottom: 12px;
            line-height: 1.5;
        }
        .modal-input {
            width: 100%;
            padding: clamp(10px, 2vw, 12px);
            margin-bottom: 10px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: clamp(12px, 2.5vw, 14px);
        }
        .modal-input:focus {
            outline: none;
            border-color: var(--btn-bg);
        }
        .modal-buttons {
            display: flex;
            gap: 8px;
            margin-top: 15px;
        }
        .modal-btn {
            flex: 1;
            padding: clamp(10px, 2vw, 12px);
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            font-size: clamp(12px, 2.5vw, 14px);
            touch-action: manipulation;
        }
        .modal-btn.save {
            background: var(--btn-bg);
            color: white;
        }
        .modal-btn.save:active {
            background: var(--btn-hover);
        }
        .modal-btn.cancel {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }
        .modal-btn.cancel:active {
            background: var(--border-color);
        }
        .victory-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }
        .victory-overlay.active {
            display: flex;
        }
        .victory-popup {
            background: var(--bg-primary);
            padding: clamp(20px, 5vw, 40px);
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            animation: popIn 0.4s ease-out;
            max-width: 95%;
            max-height: 95vh;
            overflow-y: auto;
        }
        .victory-popup h2 {
            font-size: clamp(1.8rem, 6vw, 2.5rem);
            color: var(--btn-bg);
            margin-bottom: 10px;
        }
        .victory-popup p {
            font-size: clamp(0.9rem, 3vw, 1.1rem);
            color: var(--text-primary);
            margin-bottom: 15px;
        }
        .victory-popup .final-puzzle {
            margin: 15px 0;
            border-radius: 12px;
            max-width: 100%;
            width: clamp(250px, 80vw, 450px);
            height: auto;
            max-height: 50vh;
            box-shadow: 0 4px 15px var(--shadow);
        }
        .victory-popup button {
            display: inline-block;
            width: auto;
            padding: clamp(10px, 2vw, 12px) clamp(25px, 5vw, 40px);
            background: var(--btn-bg);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: clamp(12px, 3vw, 1rem);
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 15px;
            touch-action: manipulation;
        }
        .victory-popup button:active {
            background: var(--btn-hover);
            transform: scale(0.98);
        }
        @keyframes popIn {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        @keyframes puzzleEntrance {
            0% {
                transform: scale(0) rotate(-180deg);
                opacity: 0;
            }
            50% {
                transform: scale(1.1) rotate(0deg);
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }
        @keyframes puzzleFall {
            0% {
                transform: translateY(-80px) rotate(360deg);
                opacity: 0;
            }
            100% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
        }
        @keyframes puzzleExplosion {
            0% {
                transform: scale(0.3) rotate(-180deg);
                opacity: 0;
                filter: blur(4px);
            }
            60% {
                transform: scale(1.2);
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
                filter: blur(0px);
            }
        }
        @keyframes puzzleFlip {
            0% {
                transform: rotateX(90deg) scale(0.5);
                opacity: 0;
            }
            100% {
                transform: rotateX(0deg) scale(1);
                opacity: 1;
            }
        }
        @keyframes puzzleSlideIn {
            0% {
                transform: translateX(-100px) rotate(-90deg);
                opacity: 0;
            }
            100% {
                transform: translateX(0) rotate(0deg);
                opacity: 1;
            }
        }
        @keyframes puzzleSlideInRight {
            0% {
                transform: translateX(100px) rotate(90deg);
                opacity: 0;
            }
            100% {
                transform: translateX(0) rotate(0deg);
                opacity: 1;
            }
        }
        @keyframes puzzleBounce {
            0% {
                transform: scale(0) translateY(-50px);
                opacity: 0;
            }
            50% {
                transform: scale(1.15);
            }
            70% {
                transform: scale(0.95);
            }
            100% {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }
        @keyframes puzzleWave {
            0% {
                transform: translateY(40px) skewY(-5deg);
                opacity: 0;
            }
            100% {
                transform: translateY(0) skewY(0deg);
                opacity: 1;
            }
        }
        @keyframes puzzleZoomIn {
            0% {
                transform: scale(0) translateZ(0);
                opacity: 0;
            }
            70% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        @keyframes puzzleGhost {
            0% {
                transform: translateY(-30px) rotate(180deg) scale(0.3);
                opacity: 0;
                filter: blur(8px) brightness(0.5);
            }
            50% {
                filter: blur(4px) brightness(0.8);
            }
            100% {
                transform: translateY(0) rotate(0deg) scale(1);
                opacity: 1;
                filter: blur(0px) brightness(1);
            }
        }
        
        .puzzle-piece.entrance-spin {
            animation: puzzleEntrance 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
        }
        .puzzle-piece.entrance-fall {
            animation: puzzleFall 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        .puzzle-piece.entrance-explosion {
            animation: puzzleExplosion 0.8s cubic-bezier(0.36, 0, 0.66, -0.56) forwards;
        }
        .puzzle-piece.entrance-flip {
            animation: puzzleFlip 0.6s ease-out forwards;
        }
        .puzzle-piece.entrance-slide {
            animation: puzzleSlideIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
        }
        .puzzle-piece.entrance-slide-right {
            animation: puzzleSlideInRight 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
        }
        .puzzle-piece.entrance-bounce {
            animation: puzzleBounce 0.7s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
        }
        .puzzle-piece.entrance-wave {
            animation: puzzleWave 0.6s ease-out forwards;
        }
        .puzzle-piece.entrance-zoom {
            animation: puzzleZoomIn 0.6s cubic-bezier(0.43, 0.13, 0.23, 0.96) forwards;
        }
        .puzzle-piece.entrance-ghost {
            animation: puzzleGhost 0.8s ease-out forwards;
        }
        
        @media (max-width: 600px) {
            body {
                padding: 8px;
            }
            .container {
                padding: 10px;
                border-radius: 10px;
            }
            .controls-bar {
                gap: 4px;
            }
            .puzzle-grid {
                padding: 2px;
            }
            .puzzle-piece.unfixed {
                margin: 1px;
            }
        }
        @media (max-height: 700px) {
            .image-preview {
                min-height: 80px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧩 Puzzle <span id="version">v2.22</span></h1>
        </div>
        <div class="controls-bar">
            <select id="divisionsSelect" title="Nombre de peces">
                <option value="2">2×2</option>
                <option value="3">3×3</option>
                <option value="4" selected>4×4</option>
                <option value="5">5×5</option>
            </select>
            <button class="icon-btn" id="flickrMyBtn" title="Flickr (meu)">🖼️</button>
            <button class="icon-btn" id="flickrRandomBtn" title="Flickr (aleatori)">🌍</button>
            <button class="icon-btn" id="picsumBtn" title="Imatge aleatoria">🎨</button>
            <button class="icon-btn" id="refreshBtn" title="Nova foto">🔄</button>
            <div style="flex: 1;"></div>
            <button class="icon-btn" id="animationsToggle" title="Activar/desactivar animacions">✨</button>
            <button class="icon-btn" id="helpToggle" title="Amb ajuda o sense">🆘</button>
            <button class="theme-toggle" id="themeToggle" title="Canviar mode fosc">🌙</button>
        </div>
        <div id="puzzleContainer" class="puzzle-grid"></div>
        <div id="imagePreview" class="image-preview">
            <img id="previewImg" src="" alt="Original" crossOrigin="anonymous">
        </div>
        <div class="log" id="log">Carregant...</div>
    </div>
    <div id="flickrModal" class="modal">
        <div class="modal-content">
            <h2>🖼️ Flickr</h2>
            <p>Enganxa les teves credencials de Flickr. Es guardaran només al teu dispositiu.</p>
            <input type="text" class="modal-input" id="apiKeyInput" placeholder="API Key">
            <input type="text" class="modal-input" id="userIdInput" placeholder="User ID">
            <div class="modal-buttons">
                <button class="modal-btn cancel" id="cancelFlickrBtn">Cancelar</button>
                <button class="modal-btn save" id="saveFlickrBtn">Guardar</button>
            </div>
        </div>
    </div>
    <div id="victoryOverlay" class="victory-overlay">
        <div class="victory-popup">
            <h2>🎉 VISCA!</h2>
            <p>Has completat el puzzle!</p>
            <img id="finalImage" class="final-puzzle" src="" alt="Puzzle completat">
            <br>
            <button id="victoryBtn">Jugar de Nou</button>
        </div>
    </div>
    <script>
        const divisionsSelect = document.getElementById('divisionsSelect');
        const flickrMyBtn = document.getElementById('flickrMyBtn');
        const flickrRandomBtn = document.getElementById('flickrRandomBtn');
        const picsumBtn = document.getElementById('picsumBtn');
        const refreshBtn = document.getElementById('refreshBtn');
        const animationsToggle = document.getElementById('animationsToggle');
        const helpToggle = document.getElementById('helpToggle');
        const puzzleContainer = document.getElementById('puzzleContainer');
        const previewImg = document.getElementById('previewImg');
        const logDiv = document.getElementById('log');
        const victoryOverlay = document.getElementById('victoryOverlay');
        const victoryBtn = document.getElementById('victoryBtn');
        const finalImage = document.getElementById('finalImage');
        const themeToggle = document.getElementById('themeToggle');
        const imagePreview = document.getElementById('imagePreview');
        const flickrModal = document.getElementById('flickrModal');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const userIdInput = document.getElementById('userIdInput');
        const saveFlickrBtn = document.getElementById('saveFlickrBtn');
        const cancelFlickrBtn = document.getElementById('cancelFlickrBtn');

        let imagenActual = null;
        let divisions = 4;
        let ordre = [];
        let fixat = [];
        let pecesDataURL = [];
        let lastSource = 'picsum';
        let isDifficultyMode = true;
        let isAnimationsEnabled = true;
        let isMobile = window.innerWidth <= 768;

        const animationTypes = [
            'entrance-spin', 'entrance-fall', 'entrance-explosion', 'entrance-flip',
            'entrance-slide', 'entrance-slide-right', 'entrance-bounce', 'entrance-wave',
            'entrance-zoom', 'entrance-ghost'
        ];

        window.addEventListener('resize', () => {
            isMobile = window.innerWidth <= 768;
        });

        function initTheme() {
            const isDark = localStorage.getItem('darkMode') === 'true';
            if (isDark) {
                document.body.classList.add('dark-mode');
                themeToggle.textContent = '☀️';
            }
        }

        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('darkMode', isDark);
            themeToggle.textContent = isDark ? '☀️' : '🌙';
        });

        helpToggle.addEventListener('click', () => {
            isDifficultyMode = !isDifficultyMode;
            if (isDifficultyMode) {
                helpToggle.textContent = '🚀';
                imagePreview.classList.add('hidden');
            } else {
                helpToggle.textContent = '🆘';
                imagePreview.classList.remove('hidden');
            }
        });

        function initAnimations() {
            const saved = localStorage.getItem('enableAnimations');
            isAnimationsEnabled = saved !== 'false';
            updateAnimationsButton();
        }

        function updateAnimationsButton() {
            animationsToggle.textContent = '✨';
            animationsToggle.style.opacity = isAnimationsEnabled ? '1' : '0.4';
        }

        animationsToggle.addEventListener('click', () => {
            isAnimationsEnabled = !isAnimationsEnabled;
            localStorage.setItem('enableAnimations', isAnimationsEnabled);
            updateAnimationsButton();
            log(isAnimationsEnabled ? '✨ Animacions activades' : '✨ Animacions desactivades');
        });

        function getRandomAnimation() {
            return animationTypes[Math.floor(Math.random() * animationTypes.length)];
        }

        flickrMyBtn.addEventListener('click', () => {
            const savedApiKey = localStorage.getItem('flickrApiKey');
            const savedUserId = localStorage.getItem('flickrUserId');
            if (savedApiKey && savedUserId) {
                lastSource = 'flickr-my';
                carregarFlickrMy();
            } else {
                flickrModal.classList.add('active');
            }
        });

        flickrRandomBtn.addEventListener('click', () => {
            const savedApiKey = localStorage.getItem('flickrApiKey');
            if (savedApiKey) {
                lastSource = 'flickr-random';
                carregarFlickrRandom();
            } else {
                log('❌ Necessites API Key de Flickr');
            }
        });

        saveFlickrBtn.addEventListener('click', () => {
            const apiKey = apiKeyInput.value.trim();
            const userId = userIdInput.value.trim();
            if (!apiKey || !userId) {
                log('❌ Omple tots els camps');
                return;
            }
            localStorage.setItem('flickrApiKey', apiKey);
            localStorage.setItem('flickrUserId', userId);
            apiKeyInput.value = '';
            userIdInput.value = '';
            flickrModal.classList.remove('active');
            lastSource = 'flickr-my';
            carregarFlickrMy();
        });

        cancelFlickrBtn.addEventListener('click', () => {
            apiKeyInput.value = '';
            userIdInput.value = '';
            flickrModal.classList.remove('active');
        });

        function carregarFlickrMy() {
            const apiKey = localStorage.getItem('flickrApiKey');
            const userId = localStorage.getItem('flickrUserId');
            if (!apiKey || !userId) {
                log('❌ Configura Flickr primer');
                return;
            }
            log('🔄 Obtenint totes les fotos...');
            obtenerTodasLasFotos(userId, apiKey, 'flickr-my');
        }

        function carregarFlickrRandom() {
            const apiKey = localStorage.getItem('flickrApiKey');
            if (!apiKey) {
                log('❌ Necessites API Key');
                return;
            }
            log('🔄 Obtenint fotos interessants...');
            obtenerTodasLasFotosRandom(apiKey, 'flickr-random');
        }

        async function obtenerTodasLasFotos(userId, apiKey, source) {
            try {
                let todasLasFotos = [];
                let page = 1;
                let hasMore = true;
                while (hasMore) {
                    const url = `https://www.flickr.com/services/rest/?method=flickr.people.getPublicPhotos&user_id=${userId}&api_key=${apiKey}&format=json&nojsoncallback=1&per_page=500&page=${page}`;
                    const response = await fetch(url);
                    const data = await response.json();
                    if (data.stat === 'fail') {
                        log('❌ Error: ' + data.message);
                        return;
                    }
                    if (!data.photos || data.photos.photo.length === 0) {
                        hasMore = false;
                    } else {
                        todasLasFotos = todasLasFotos.concat(data.photos.photo);
                        page++;
                        if (todasLasFotos.length > 1000) {
                            hasMore = false;
                        }
                    }
                }
                log(`✅ Trobades ${todasLasFotos.length} fotos`);
                if (todasLasFotos.length === 0) {
                    log('❌ Cap foto disponible');
                    return;
                }
                const fotoAleatoria = todasLasFotos[Math.floor(Math.random() * todasLasFotos.length)];
                const imageUrl = `https://live.staticflickr.com/${fotoAleatoria.server}/${fotoAleatoria.id}_${fotoAleatoria.secret}_b.jpg`;
                cargarImagenDesdeUrl(imageUrl, source);
            } catch (err) {
                log('❌ Error: ' + err.message);
            }
        }

        async function obtenerTodasLasFotosRandom(apiKey, source) {
            try {
                let todasLasFotos = [];
                let page = 1;
                let hasMore = true;
                while (hasMore) {
                    const url = `https://www.flickr.com/services/rest/?method=flickr.interestingness.getList&api_key=${apiKey}&format=json&nojsoncallback=1&per_page=500&page=${page}`;
                    const response = await fetch(url);
                    const data = await response.json();
                    if (data.stat === 'fail') {
                        log('❌ Error: ' + data.message);
                        return;
                    }
                    if (!data.photos || data.photos.photo.length === 0) {
                        hasMore = false;
                    } else {
                        todasLasFotos = todasLasFotos.concat(data.photos.photo);
                        page++;
                        if (todasLasFotos.length > 1000) {
                            hasMore = false;
                        }
                    }
                }
                log(`✅ Trobades ${todasLasFotos.length} fotos`);
                if (todasLasFotos.length === 0) {
                    log('❌ Cap foto disponible');
                    return;
                }
                const fotoAleatoria = todasLasFotos[Math.floor(Math.random() * todasLasFotos.length)];
                const imageUrl = `https://live.staticflickr.com/${fotoAleatoria.server}/${fotoAleatoria.id}_${fotoAleatoria.secret}_b.jpg`;
                cargarImagenDesdeUrl(imageUrl, source);
            } catch (err) {
                log('❌ Error: ' + err.message);
            }
        }

        function cargarImagenDesdeUrl(imageUrl, source) {
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = () => {
                imagenActual = imageUrl;
                previewImg.onload = () => {
                    log('✅ Foto carregada');
                    iniciarPuzzle();
                };
                previewImg.src = imageUrl;
                finalImage.src = imageUrl;
            };
            img.onerror = () => {
                log('❌ Error al carregar la foto');
            };
            img.src = imageUrl;
        }

        picsumBtn.addEventListener('click', () => {
            puzzleContainer.innerHTML = ''; 
            lastSource = 'picsum';
            carregarImagenAleatoria();
        });
        
        function carregarUltima() {
            if (lastSource === 'picsum') {
                carregarImagenAleatoria();
            } else if (lastSource === 'flickr-my') {
                carregarFlickrMy();
            } else if (lastSource === 'flickr-random') {
                carregarFlickrRandom();
            }
        }

        refreshBtn.addEventListener('click', () => {
            puzzleContainer.innerHTML = ''; // Neteja la pantalla immediatament
            carregarUltima();
        });

        function log(msg) {
            console.log(msg);
            logDiv.textContent = msg;
        }

        function carregarImagenAleatoria() {
            log('🔄 Carregant imatge...');
            const seed = Math.floor(Math.random() * 1000000);
            const imageUrl = `https://picsum.photos/seed/puzzle${seed}/400/400`;
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = () => {
                imagenActual = imageUrl;
                previewImg.onload = () => {
                    log('✅ Imatge carregada');
                    iniciarPuzzle();
                };
                previewImg.src = imageUrl;
                finalImage.src = imageUrl;
            };
            img.onerror = () => {
                log('❌ Error al carregar. Proba de nou.');
            };
            img.src = imageUrl;
        }

    function iniciarPuzzle() {
        if (!imagenActual) {
            log('⚠️ Carrega una imatge primer');
            return;
        }
        
        divisions = parseInt(divisionsSelect.value);
        const total = divisions * divisions;
        log(`📦 Creant puzzle ${divisions}×${divisions}...`);
    
        const canvas = document.createElement('canvas');
        canvas.width = 400;
        canvas.height = 400;
        const ctx = canvas.getContext('2d');
    
        const processImage = () => {
            try {
                ctx.drawImage(previewImg, 0, 0, 400, 400);
            } catch (e) {
                log('❌ Error al dibuixar la imatge');
                return;
            }
    
            pecesDataURL = [];
            const pieceSize = 400 / divisions;
            for (let row = 0; row < divisions; row++) {
                for (let col = 0; col < divisions; col++) {
                    const pieceCanvas = document.createElement('canvas');
                    pieceCanvas.width = pieceSize;
                    pieceCanvas.height = pieceSize;
                    const pctx = pieceCanvas.getContext('2d');
                    pctx.drawImage(
                        canvas,
                        col * pieceSize, row * pieceSize, pieceSize, pieceSize,
                        0, 0, pieceSize, pieceSize
                    );
                    pecesDataURL.push(pieceCanvas.toDataURL());
                }
            }
    
            ordre = Array.from({ length: total }, (_, i) => i);
            for (let i = total - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [ordre[i], ordre[j]] = [ordre[j], ordre[i]];
            }
            fixat = new Array(total).fill(false);
    
            // NOU CODI: Mostrar la imatge sencera al tauler abans de dividir
            puzzleContainer.innerHTML = ''; 
            puzzleContainer.style.gridTemplateColumns = '1fr'; 
            
            const imatgeSenceraDiv = document.createElement('div');
            imatgeSenceraDiv.style.width = '100%';
            imatgeSenceraDiv.style.height = '100%';
            imatgeSenceraDiv.style.backgroundImage = `url('${imagenActual}')`;
            imatgeSenceraDiv.style.backgroundSize = '100% 100%';
            imatgeSenceraDiv.style.backgroundPosition = 'center';
            imatgeSenceraDiv.style.borderRadius = '6px';
            
            puzzleContainer.appendChild(imatgeSenceraDiv);
    
            if (!isDifficultyMode) {
                imagePreview.classList.remove('hidden');
                log('✨ Veient la foto sencera (ajuda visible)...');
            } else {
                log('✨ Veient la foto sencera (sense ajuda)...');
            }
    
            // Esperem 2.5 segons amb la imatge sencera al tauler abans de trencar-la
            setTimeout(() => {
                renderitzarPuzzle(true); // renderitzarPuzzle ja s'encarrega de buidar el contenidor i aplicar el grid
                log('🧩 Arrossega les peces!');
            }, 2500);
    };

    processImage();
}

        function renderitzarPuzzle(animate = false) {
            const total = divisions * divisions;
            puzzleContainer.innerHTML = '';
            puzzleContainer.style.gridTemplateColumns = `repeat(${divisions}, 1fr)`;

            for (let i = 0; i < total; i++) {
                const pecaIndex = ordre[i];
                const piece = document.createElement('div');
                piece.className = 'puzzle-piece';
                piece.classList.add(fixat[i] ? 'fixed' : 'unfixed');
                piece.style.backgroundImage = `url('${pecesDataURL[pecaIndex]}')`;
                piece.style.backgroundSize = '100% 100%';
                piece.style.backgroundPosition = 'center';
                piece.dataset.posicio = i;

                if (animate && isAnimationsEnabled) {
                    const randomAnimation = getRandomAnimation();
                    piece.classList.add(randomAnimation);
                    piece.style.animationDelay = (i * 0.05) + 's';
                }

                if (!fixat[i]) {
                    piece.draggable = true;
                    piece.addEventListener('dragstart', handleDragStart);
                    piece.addEventListener('dragover', handleDragOver);
                    piece.addEventListener('drop', handleDrop);
                    piece.addEventListener('dragend', handleDragEnd);
                    piece.addEventListener('touchstart', handleTouchStart);
                    piece.addEventListener('touchmove', handleTouchMove);
                    piece.addEventListener('touchend', handleTouchEnd);
                }
                puzzleContainer.appendChild(piece);
            }
        }

        let origenIndex = null;

        function handleDragStart(e) {
            origenIndex = parseInt(e.target.dataset.posicio);
            e.dataTransfer.effectAllowed = 'move';
            e.target.style.opacity = '0.5';
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        }

        function handleDrop(e) {
            e.preventDefault();
            const destiPiece = e.target.closest('.puzzle-piece');
            if (!destiPiece || fixat[destiPiece.dataset.posicio]) return;
            const destiIndex = parseInt(destiPiece.dataset.posicio);
            if (origenIndex === null || origenIndex === destiIndex) return;
            [ordre[origenIndex], ordre[destiIndex]] = [ordre[destiIndex], ordre[origenIndex]];
            for (let i = 0; i < ordre.length; i++) {
                fixat[i] = (ordre[i] === i);
            }
            renderitzarPuzzle(false);
            comprovarVictoria();
            origenIndex = null;
        }

        function handleDragEnd(e) {
            e.target.style.opacity = '1';
        }

        let touchPiece = null;
        let floatingClone = null;

        function handleTouchStart(e) {
            touchPiece = e.target.closest('.puzzle-piece');
            if (!touchPiece || fixat[touchPiece.dataset.posicio]) return;
            floatingClone = touchPiece.cloneNode(true);
            floatingClone.style.position = 'fixed';
            floatingClone.style.zIndex = '1001';
            floatingClone.style.pointerEvents = 'none';
            floatingClone.style.boxShadow = '0 8px 20px rgba(0,0,0,0.3)';
            floatingClone.classList.add('unfixed');

            const rect = touchPiece.getBoundingClientRect();
            floatingClone.style.left = rect.left + 'px';
            floatingClone.style.top = rect.top + 'px';
            floatingClone.style.width = rect.width + 'px';
            floatingClone.style.height = rect.height + 'px';

            document.body.appendChild(floatingClone);
            touchPiece.style.opacity = '0.3';
        }

        function handleTouchMove(e) {
            if (!floatingClone) return;
            e.preventDefault();
            const touch = e.touches[0];
            const rect = floatingClone.getBoundingClientRect();
            const width = rect.width;
            const height = rect.height;
            floatingClone.style.left = (touch.clientX - width / 2) + 'px';
            floatingClone.style.top = (touch.clientY - height / 2) + 'px';
        }

        function handleTouchEnd(e) {
            if (!touchPiece || !floatingClone) return;
            const touch = e.changedTouches[0];
            const targetElement = document.elementFromPoint(touch.clientX, touch.clientY);
            const destiPiece = targetElement.closest('.puzzle-piece');
            if (destiPiece && destiPiece !== touchPiece && !fixat[destiPiece.dataset.posicio]) {
                const origenIndex = parseInt(touchPiece.dataset.posicio);
                const destiIndex = parseInt(destiPiece.dataset.posicio);
                [ordre[origenIndex], ordre[destiIndex]] = [ordre[destiIndex], ordre[origenIndex]];
                for (let i = 0; i < ordre.length; i++) {
                    fixat[i] = (ordre[i] === i);
                }
                renderitzarPuzzle(false);
                comprovarVictoria();
            } else {
                touchPiece.style.opacity = '1';
            }
            document.body.removeChild(floatingClone);
            floatingClone = null;
            touchPiece = null;
        }

        function comprovarVictoria() {
            const totsFixats = fixat.every(v => v === true);
            if (totsFixats) {
                log('🎉 VISCA!');
                victoryOverlay.classList.add('active');
            } else {
                const correctes = fixat.filter(v => v).length;
                log(`🧩 ${correctes}/${ordre.length} peces correctes`);
            }
        }

        victoryBtn.addEventListener('click', () => {
            victoryOverlay.classList.remove('active');
            puzzleContainer.innerHTML = ''; // Amaga el puzzle completat antic
            carregarUltima();
        });
        
        divisionsSelect.addEventListener('change', () => {
            if (imagenActual) iniciarPuzzle();
        });

        initTheme();
        initAnimations();
        // Sincronitzar el mode difícil al carregar
        if (isDifficultyMode) {
            helpToggle.textContent = '🚀';
            imagePreview.classList.add('hidden');
        } else {
            helpToggle.textContent = '🆘';
            imagePreview.classList.remove('hidden');
        }
        carregarImagenAleatoria();
    </script>
